<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Preparing Printer…</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <style>
    /* Keep this inline: first-boot flashing runs from file:// without the configurator server. */
    :root{
      color-scheme:dark;
      --bg:#121314; --card:#1F2023; --surface-0:#17181A; --surface-2:#292B2F;
      --card-border:#32353A; --text:#EEF0F3; --text-sub:#ACAFB8; --dim:#999DA6;
      --accent:#E7C547; --accent-soft:#CEB147;
      --error:#ef4444; --success:#22c55e;
    }
    *,*::before,*::after{box-sizing:border-box}
    html,body{min-height:100%;margin:0;background:var(--bg);color:var(--text);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Helvetica,Arial}
    .wrap{min-height:100dvh;display:grid;place-items:center;padding:24px}
    .card{width:min(960px,100%);min-width:0;max-height:calc(100dvh - 48px);overflow:auto;padding:32px;
      border:1px solid var(--card-border);border-radius:16px;background:var(--card);
      box-shadow:0 4px 20px rgba(0,0,0,.08);display:grid;gap:24px}
    .maintenance-brand{display:flex;align-items:center;gap:12px}
    .logo{height:34px;width:auto;object-fit:contain}
    .brand-copy{display:grid;gap:2px}
    .brand-name{font-size:14px;font-weight:650;letter-spacing:-.2px}
    .brand-caption{font-size:11px;color:var(--dim)}
    .page-header{display:grid;gap:12px}
    .eyebrow{display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
    .eyebrow::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--accent)}
    .row{display:flex;gap:16px;align-items:center;min-width:0}
    .row > div{min-width:0}
    h1{margin:0;font-size:28px;font-weight:650;line-height:1.25;letter-spacing:-.6px;overflow-wrap:anywhere}
    .sub{color:var(--text-sub);font-size:14px;line-height:1.65;margin-top:8px}
    .spin{width:34px;height:34px;border:3px solid var(--card-border);border-top-color:var(--accent);
      border-radius:50%;animation:spin 1s linear infinite;flex:0 0 auto}
    @keyframes spin{to{transform:rotate(360deg)}}
    .progress-panel{padding:20px;border:1px solid var(--card-border);border-radius:12px;background:var(--surface-0);display:grid;gap:16px}
    .progress-heading{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
    .bar>div{height:100%;width:0%;background:linear-gradient(90deg,var(--accent-soft),var(--accent));transition:width .3s ease}
    #status{font-size:14px;font-weight:600;margin:0;color:var(--text)}
    #pnum{font-size:13px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums;flex-shrink:0}
    .grid{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:start}
    .panel{min-width:0}
    .panel h3{margin:0 0 12px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
    details{background:var(--surface-0);padding:16px;border:1px solid var(--card-border);border-radius:12px}
    summary{font-size:13px;color:var(--text-sub);cursor:pointer}
    summary:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:2px}
    pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:220px;overflow:auto;
      border-top:1px solid var(--card-border);padding:12px 0 0;margin:12px 0 0;font-size:13px;line-height:1.65}
    .hint-banner{font-size:18px;font-weight:600;line-height:1.6;padding:16px;
      border-radius:12px;border:1px solid var(--card-border);border-left:2px solid var(--card-border);background:var(--surface-0);color:var(--text);overflow-wrap:anywhere}
    .hint-banner.attn{border-left-color:var(--accent);background:rgba(231,197,71,.05)}
    .hint-banner.warn{border-color:rgba(239,68,68,.3);border-left-color:var(--error);background:rgba(239,68,68,.08);color:#FFE7E7}
    .hint-banner.success{border-color:rgba(34,197,94,.3);border-left-color:var(--success);background:rgba(34,197,94,.1);color:#E9FFE9}
    @media(max-width:880px){.grid{grid-template-columns:1fr}}
    @media(max-height:650px) and (min-width:601px){
      .card{padding:24px;gap:16px}
      .logo{height:30px}
      .page-header{gap:10px}
      h1{font-size:24px}
      .progress-panel{padding:16px;gap:12px}
      .grid{grid-template-columns:1.1fr .9fr;gap:20px}
      .hint-banner{font-size:16px}
      pre{max-height:140px}
    }
    @media(max-width:600px){
      .wrap{padding:16px}
      .card{padding:20px;gap:20px;max-height:calc(100dvh - 32px)}
      .logo{height:30px}
      h1{font-size:24px}
      .progress-panel{padding:16px}
      .hint-banner{font-size:16px}
    }
    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{animation:none !important;transition:none !important}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="maintenance-brand">
        <img class="logo" src="re3d-logo.png" alt="re:3D logo" />
        <div class="brand-copy">
          <span class="brand-name">Configurator</span>
          <span class="brand-caption">re:3D Klipper OS</span>
        </div>
      </div>
      <header class="page-header">
        <div class="eyebrow">Mainboard firmware</div>
        <div class="row">
          <div class="spin" aria-hidden="true"></div>
          <div>
            <h1>Preparing printer…</h1>
            <div class="sub">Keep the printer powered and the USB cable connected.</div>
          </div>
        </div>
      </header>

      <div class="progress-panel">
        <div class="progress-heading">
          <div id="status" class="sub">Starting…</div>
          <div id="pnum">0%</div>
        </div>
        <div class="bar"><div id="pbar"></div></div>
      </div>

      <div class="grid">
        <div class="panel">
          <h3>Status</h3>
          <div id="hint" class="hint-banner" role="status">Please wait. Do not unplug or power off.</div>
        </div>

        <div class="panel">
          <h3>More information</h3>
          <!-- Always open -->
          <details id="details" open>
            <summary>Technical details</summary>
            <pre id="log">waiting for logs…</pre>
          </details>
        </div>
      </div>
    </div>
  </div>

  <script>
    const LOG     = 'file:///var/log/flash_once.log';
    const STATUS  = 'file:///tmp/flash_status.json';
    const DEVLIST = 'file:///tmp/flash_devices.json';

    function statusLabel(state){
      switch(state){
        case 'waiting_device': return 'Waiting for board…';
        case 'running':        return 'Working…';
        case 'power_cycle':    return 'Power-cycle required';
        case 'done':           return 'Complete';
        case 'error':          return 'Error';
        default:               return 'Working…';
      }
    }
    function hintFor(state, hasAnyDevices, message){
      if(message) return message;
      if(state==='power_cycle')
        return 'Please switch the machine OFF, then ON. This power-cycles both the Pi and mainboard.';
      if(state==='waiting_device'){
        return hasAnyDevices
          ? 'Board detected but not ready. Please erase the Archimajor board and the firmware will be flashed automatically.'
          : 'No connection detected. Check printer power and the USB cable/port.';
      }
      if(state==='done')  return 'Flashing complete.';
      if(state==='error') return 'There was an issue. See the details for more information.';
      return 'Please wait. Do not unplug or power off.';
    }

    async function fetchJSON(u){ try{const r=await fetch(u,{cache:'no-store'}); if(!r.ok) throw 0; return r.json();}catch{ return null; } }
    async function fetchText(u){ try{const r=await fetch(u,{cache:'no-store'}); if(!r.ok) throw 0; return r.text();}catch{ return null; } }
    function tail(t,n=300){ if(!t) return ''; const a=t.trimEnd().split(/\r?\n/); return a.slice(-n).join('\n'); }
    function autoscroll(pre){ pre.scrollTop = pre.scrollHeight; }

    let ticking=false;
    async function tick(){
      if(ticking) return; ticking=true;

      let state='running', progress=0;

      const s = await fetchJSON(STATUS);
      if(s){
        state = s.state ?? state;
        progress = Math.max(0,Math.min(100,Number(s.progress||0)));
      }

      // real device presence
      let hasAnyDevices=false;
      const devs = await fetchJSON(DEVLIST);
      if(Array.isArray(devs) && devs.length>0) hasAnyDevices = true;

      // update UI
      document.getElementById('status').textContent = statusLabel(state);
      document.getElementById('pbar').style.width   = progress + '%';
      document.getElementById('pnum').textContent   = progress + '%';

      const hintEl = document.getElementById('hint');
      const newHintText = hintFor(state, hasAnyDevices, s?.message || '');
      const newHintClass = (state==='power_cycle'||state==='waiting_device') ? 'attn'
                         : state==='error' ? 'warn'
                         : state==='done'  ? 'success'
                         : '';
      // Only mutate DOM if something actually changed — avoids restarting CSS animations every tick
      if(hintEl.textContent !== newHintText) hintEl.textContent = newHintText;
      if(!hintEl.classList.contains(newHintClass) || ['attn','warn','success'].some(c=>c!==newHintClass && hintEl.classList.contains(c))){
        hintEl.classList.remove('attn','warn','success');
        if(newHintClass) hintEl.classList.add(newHintClass);
      }

      const logEl = document.getElementById('log');
      const log = await fetchText(LOG);
      if(log!==null){
        logEl.textContent = tail(log, 300);
        requestAnimationFrame(()=>autoscroll(logEl));
      }

      ticking=false;
    }

    setInterval(tick,1000);
    tick();
  </script>
</body>
</html>
