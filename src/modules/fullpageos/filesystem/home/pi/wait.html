<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Preparing Printer…</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <style>
    :root{
      --bg:#0b1220; --card:#0e1726cc; --border:#1e2a3f; --accent:#5aa2ff; --muted:#142034;
      --txt:#ffffff; --txt2:#d6e2f1;
    }
    html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Helvetica,Arial}
    .wrap{height:100%;display:grid;place-items:center;padding:16px}
    /* Sized for 1024x640: take most of width, comfy height */
    .card{
      width:min(960px, 96vw);
      min-height:480px;
      box-sizing:border-box;
      padding:32px 32px 24px;
      border:1px solid var(--border);
      border-radius:18px;
      background:var(--card);
      backdrop-filter:blur(3px);
    }
    /* Header row */
    .row{display:flex;gap:18px;align-items:center;margin:0 0 8px}
    h1{margin:0;font-size:28px}
    .sub{color:var(--txt2);opacity:.9}
    /* Spinner & progress */
    .spin{width:72px;height:72px;border:7px solid #32465f;border-top-color:#fff;border-radius:50%;
      animation:spin 1s linear infinite;flex:0 0 auto}
    @keyframes spin{to{transform:rotate(360deg)}}
    .bar{height:14px;border-radius:999px;background:var(--muted);overflow:hidden;margin:12px 0 6px}
    .bar>div{height:100%;width:0%;background:var(--accent);transition:width .3s ease}
    #status{font-size:18px;margin-top:6px}
    #pnum{font-size:14px;color:var(--txt2)}
    /* Big refresh button when waiting */
    button{
      margin-top:14px;padding:16px 28px;font-size:18px;font-weight:600;
      border-radius:12px;border:1px solid var(--border);background:#1a2a42;color:#fff;cursor:pointer
    }
    button:hover{filter:brightness(1.15)}
    /* Collapsible details */
    details{margin-top:14px}
    summary{cursor:pointer;color:var(--txt2);font-size:15px}
    pre{white-space:pre-wrap;background:#0a1524;padding:12px;border-radius:12px;
      max-height:36vh;overflow:auto;border:1px solid #1a2a42;margin:10px 0 0;font-size:13px}
    /* Layout grid to use width: main left, details right (collapsible still) */
    .grid{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:start;margin-top:12px}
    @media (max-width: 880px){
      .grid{grid-template-columns:1fr}
    }
    .panel{border:1px solid var(--border);border-radius:14px;padding:16px}
    .panel h3{margin:0 0 6px;font-size:18px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="row">
        <div class="spin"></div>
        <div>
          <h1>Preparing printer…</h1>
          <div class="sub">Keep the printer powered and the USB cable connected. It will reboot automatically when finished.</div>
        </div>
      </div>

      <div id="status" class="sub">Starting…</div>
      <div class="bar"><div id="pbar"></div></div>
      <div id="pnum">0%</div>

      <div class="grid">
        <!-- Main guidance -->
        <div class="panel">
          <h3>Status</h3>
          <p id="hint" class="sub" style="margin:6px 0 0">
            Please wait. Do not unplug or power off.
          </p>
          <button id="refresh" style="display:none">Refresh</button>
        </div>

        <!-- Optional details -->
        <div class="panel">
          <h3>More information</h3>
          <details id="details">
            <summary>Show technical details</summary>
            <pre id="log">waiting for logs…</pre>
          </details>
        </div>
      </div>
    </div>
  </div>

  <script>
    const LOG     = 'file:///var/log/flash_once.log';
    const STATUS  = 'file:///tmp/flash_status.json';
    const DEVLIST = 'file:///tmp/flash_devices.json';

    async function fetchJSON(u){ try{const r=await fetch(u,{cache:'no-store'}); if(!r.ok) throw 0; return r.json();}catch{ return null; } }
    async function fetchText(u){ try{const r=await fetch(u,{cache:'no-store'}); if(!r.ok) throw 0; return r.text();}catch{ return null; } }
    function tail(t,n=300){ if(!t) return ''; const a=t.trimEnd().split(/\r?\n/); return a.slice(-n).join('\n'); }

    function simpleHint(state,msg){
      // Friendly user guidance based on state/message
      if(state==='waiting_device'){
        if(/No USB/i.test(msg)) return 'No connection detected. Check printer power and the USB cable/port, then press Refresh.';
        return 'Board detected but not ready. If needed, erase the board so it appears as the Atmel device, then press Refresh.';
      }
      if(state==='done') return 'Flashing complete. The printer will reboot automatically.';
      if(state==='error') return 'There was an issue. You can check “Show technical details” for more info.';
      return 'Please wait. Do not unplug or power off.';
    }

    async function tick(){
      const s = await fetchJSON(STATUS);
      if(s){
        const st = s.state || 'running';
        const msg = s.message || '';
        const p  = Math.max(0, Math.min(100, Number(s.progress||0)));

        document.getElementById('status').textContent = msg || 'Working…';
        document.getElementById('pbar').style.width = p + '%';
        document.getElementById('pnum').textContent = p + '%';

        // Big friendly hints + refresh visibility
        const hint = document.getElementById('hint');
        hint.textContent = simpleHint(st, msg);
        const refreshBtn = document.getElementById('refresh');
        refreshBtn.style.display = (st==='waiting_device') ? 'inline-block' : 'none';
      }

      // Show logs under details (kept compact)
      const log = await fetchText(LOG);
      if(log!==null){
        document.getElementById('log').textContent = tail(log, 300);

      }
    }

    document.getElementById('refresh').addEventListener('click', ()=>tick());
    setInterval(tick, 1000);
    tick();
  </script>
</body>
</html>
