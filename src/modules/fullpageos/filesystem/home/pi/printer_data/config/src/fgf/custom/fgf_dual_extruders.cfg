# Dual-GBX extruder motion config (8 heating zones across 2 pellet assemblies).
# Enabled via dual_extruder_enabled=true in the [fgf] section of .master.cfg.
# This overwrites build/fgf_extruders.cfg when the dual flag is set.
#
# Assembly 1 (extruder..extruder3) shares the ESTEP pellet motor.
# Assembly 2 (extruder4..extruder7) shares the E4STEP pellet motor.
#
# PINMAP TODO (archimajor_pinmap.cfg): define aliases for assembly 2 ---
#   E4STEP, E4DIR, E4CS, plus heater/thermistor pins E3HEAT/E3THERM ..
#   E7HEAT/E7THERM (see fgf_dual_heaters.cfg), and extend
#   [duplicate_pin_override] with: E4STEP, E4DIR, E4CS

######################## ASSEMBLY 1 (motor: ESTEP) ########################

#EXTRUDER 0
[extruder]
step_pin: ESTEP
microsteps: 16
rotation_distance: 3.846
nozzle_diameter: 0.800
filament_diameter: 2.85
max_extrude_cross_section: 7
max_extrude_only_distance: 2500
pressure_advance: 0.00

#EXTRUDER 1
[extruder1]
step_pin: ESTEP
microsteps: 16
rotation_distance: 3.846
nozzle_diameter: 0.400
filament_diameter: 2.85
max_extrude_cross_section: 1
max_extrude_only_distance: 200
pressure_advance: 0.095

