[gcode_macro SYNC_EXTRUDERS]
description: Sync assembly 2 to assembly 1; RATIO is motor 2 revolutions per motor 1 revolution
variable_ratio: 1.0
variable_synced: False
variable_independent_pressure_advance: 0.0
variable_independent_smooth_time: 0.040
gcode:
	{% set state = printer['gcode_macro SYNC_EXTRUDERS'] %}
	{% set ratio = params.RATIO|default(state.ratio)|float %}
	{% if not (ratio > 0 and ratio - ratio == 0) %}
		{action_raise_error('RATIO must be a finite number greater than zero')}
	{% endif %}
	{% set distance = printer.configfile.settings.extruder.rotation_distance / ratio %}
	{% if not (distance > 0 and distance - distance == 0) %}
		{action_raise_error('RATIO produces an invalid rotation distance')}
	{% endif %}
	{% for zone in ['extruder4', 'extruder5', 'extruder6', 'extruder7'] %}
		{% if zone in printer.configfile.settings and not printer[zone].can_extrude %}
			{action_raise_error('Heat assembly 2 before syncing: ' ~ zone ~ ' is below min_extrude_temp')}
		{% endif %}
	{% endfor %}
	{% set leader = printer.extruder %}
	{% set follower = printer.extruder4 %}
	M400
	{% if not state.synced %}
		SET_GCODE_VARIABLE MACRO=SYNC_EXTRUDERS VARIABLE=independent_pressure_advance VALUE={follower.pressure_advance}
		SET_GCODE_VARIABLE MACRO=SYNC_EXTRUDERS VARIABLE=independent_smooth_time VALUE={follower.smooth_time}
	{% endif %}
	ACTIVATE_EXTRUDER EXTRUDER=extruder
	SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE=extruder
	SET_EXTRUDER_ROTATION_DISTANCE EXTRUDER=extruder DISTANCE={printer.configfile.settings.extruder.rotation_distance}
	SET_EXTRUDER_ROTATION_DISTANCE EXTRUDER=extruder4 DISTANCE={distance}
	SET_PRESSURE_ADVANCE EXTRUDER=extruder4 ADVANCE={leader.pressure_advance} SMOOTH_TIME={leader.smooth_time}
	SYNC_EXTRUDER_MOTION EXTRUDER=extruder4 MOTION_QUEUE=extruder
	SET_GCODE_VARIABLE MACRO=SYNC_EXTRUDERS VARIABLE=ratio VALUE={ratio}
	SET_GCODE_VARIABLE MACRO=SYNC_EXTRUDERS VARIABLE=synced VALUE=True

[gcode_macro SET_EXTRUDER_SYNC_RATIO]
description: Set the motor synchronization RATIO; apply immediately if synced
gcode:
	{% set ratio = params.RATIO|default(0)|float %}
	{% if not (ratio > 0 and ratio - ratio == 0) %}
		{action_raise_error('RATIO must be a finite number greater than zero')}
	{% endif %}
	{% if printer['gcode_macro SYNC_EXTRUDERS'].synced %}
		SYNC_EXTRUDERS RATIO={ratio}
	{% else %}
		SET_GCODE_VARIABLE MACRO=SYNC_EXTRUDERS VARIABLE=ratio VALUE={ratio}
	{% endif %}

[gcode_macro UNSYNC_EXTRUDERS]
description: Restore independent motor queues and assembly 2 settings
gcode:
	{% set state = printer['gcode_macro SYNC_EXTRUDERS'] %}
	M400
	SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE=extruder
	SYNC_EXTRUDER_MOTION EXTRUDER=extruder4 MOTION_QUEUE=extruder4
	{% if state.synced %}
		SET_EXTRUDER_ROTATION_DISTANCE EXTRUDER=extruder4 DISTANCE={printer.configfile.settings.extruder4.rotation_distance}
		SET_PRESSURE_ADVANCE EXTRUDER=extruder4 ADVANCE={state.independent_pressure_advance} SMOOTH_TIME={state.independent_smooth_time}
	{% endif %}
	SET_GCODE_VARIABLE MACRO=SYNC_EXTRUDERS VARIABLE=synced VALUE=False

[gcode_macro T0]
description: Select assembly 1 for independent extrusion
gcode:
	UNSYNC_EXTRUDERS
	ACTIVATE_EXTRUDER EXTRUDER=extruder

[gcode_macro T1]
description: Select assembly 2 for independent extrusion
gcode:
	UNSYNC_EXTRUDERS
	ACTIVATE_EXTRUDER EXTRUDER=extruder4