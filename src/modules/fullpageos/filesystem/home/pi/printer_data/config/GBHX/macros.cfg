# ----- Heater Control -----

[gcode_macro HEAT_HOTENDS]
gcode:
  SET_HEATER_TEMPERATURE HEATER=extruder TARGET=240
  SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET=240
  SET_HEATER_TEMPERATURE HEATER=extruder2 TARGET=240
  SET_HEATER_TEMPERATURE HEATER=extruder3 TARGET=240
  SET_HEATER_TEMPERATURE HEATER=extruder4 TARGET=240
  SET_HEATER_TEMPERATURE HEATER=extruder5 TARGET=240
  SET_HEATER_TEMPERATURE HEATER=extruder6 TARGET=240
  SET_HEATER_TEMPERATURE HEATER=extruder7 TARGET=240
  SET_HEATER_TEMPERATURE HEATER=extruder8 TARGET=240
  SET_HEATER_TEMPERATURE HEATER=extruder9 TARGET=240

# ----- Syncing Toolhead Control -----

[gcode_macro TOOLHEAD_SYNC_ALL]
gcode:
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder2 MOTION_QUEUE=extruder
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder3 MOTION_QUEUE=extruder
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder4 MOTION_QUEUE=extruder
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder5 MOTION_QUEUE=extruder
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder6 MOTION_QUEUE=extruder
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder7 MOTION_QUEUE=extruder
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder8 MOTION_QUEUE=extruder
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder9 MOTION_QUEUE=extruder

[gcode_macro TOOLHEAD_SYNC_SPECIFIC]
description: Sync extruder1..extruder{COUNT-1} to extruder motion queue
variable_default_count: 10
gcode:
  {% set count = params.COUNT|default(printer["gcode_macro TOOLHEAD_SYNC_SPECIFIC"].default_count)|int %}
  {% if count < 2 %}
    RESPOND TYPE=error MSG="TOOLHEAD_SYNC_SPECIFIC: COUNT must be >= 2 (COUNT=5 syncs extruder1..extruder4)."
  {% else %}
    {% for i in range(1, count) %}
      {% set e = "extruder" ~ i %}
      SYNC_EXTRUDER_MOTION EXTRUDER={e} MOTION_QUEUE=extruder
    {% endfor %}
  {% endif %}


[gcode_macro TOOLHEAD_DESYNC_ALL]
gcode:
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder1
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder2 MOTION_QUEUE=extruder2
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder3 MOTION_QUEUE=extruder3
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder4 MOTION_QUEUE=extruder4
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder5 MOTION_QUEUE=extruder5
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder6 MOTION_QUEUE=extruder6
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder7 MOTION_QUEUE=extruder7
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder8 MOTION_QUEUE=extruder8
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder9 MOTION_QUEUE=extruder9

# ----- U-Axis and Metal Control -----

[gcode_macro HOME_METAL_HEAD]
gcode:
  logic for homing u-axis

[gcode_macro MOVE_POS_50]
gcode:
  u-axis + 50

[gcode_macro MOVE_NEG_50]
gcode:
  u-axis - 50


