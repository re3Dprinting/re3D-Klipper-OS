# ----- Toolhead Motors and Heaters -----
# Reference: https://www.klipper3d.org/Config_Reference.html?h=verify#extruder

[extruder]
step_pin: archim1:M0STEP
dir_pin: archim1:M0DIR
enable_pin: archim1:M_EN
microsteps: 16
rotation_distance: 6.743
nozzle_diameter: 0.4
filament_diameter: 2.85
heater_pin: HE0
sensor_type: MAX31856
sensor_pin: TC0
control: pid
pid_Kp: 24.856
pid_Ki: 1.493
pid_Kd: 103.462
min_temp: 0
max_temp: 380

