# z_home_failsafe_standalone.cfg
#
# Loaded via [include *standalone.cfg] in printer.cfg.
#
# Requires ~/klipper/klippy/extras/z_home_failsafe.py (deployed by updater).
#
# PURPOSE
# -------
# A crash failsafe for Z HOMING ONLY.  If the Z endstop / probe fails to
# trigger (stuck switch, unplugged wire, probe not deploying) Klipper keeps
# driving Z until the bounded homing move finishes, grinding the axis into a
# hard stop the whole way.  This watches the Z stepper(s) StallGuard load while
# Z is homing and fires an immediate emergency stop the moment the rotor is
# physically blocked (SG_RESULT collapses to ~0 while still being commanded to
# step).  Your real endstop/probe still does the homing — this only intervenes
# when it fails.
#
# It will NOT false-fire on a normal home: a normal endstop trip stops the
# stepper, the driver reaches standstill (STST=1, read from the SAME register
# as SG), and that clears the detector before it can fire.  A real crash keeps
# stepping (STST stays 0), so the low-SG streak survives and fires.
#
# ── Per-TMC driver settings (add to each [tmc5160 stepper_z] block, etc.) ────
#   driver_SGT:       0    # StallGuard sensitivity (-64..63, lower = sensitive)
#   driver_SFILT:     1    # 4-full-step hardware filtering — smoother SG
#   driver_TCOOLTHRS: 500  # make sure StallGuard is active at homing speed
#
# TUNING
# ──────
#   1. Set  action: none  (log only) and FIRMWARE_RESTART.
#   2. Home Z normally a few times and watch the Klipper log / ZFAILSAFE_STATUS
#      for the SG_RESULT seen during the descent — it should stay well above
#      block_threshold and NOT fire.
#   3. With action still 'none', force a crash safely (hold the endstop so it
#      cannot trigger, or block the axis) and confirm a "Z CRASH" log appears.
#   4. Set  action: emergency_stop  and FIRMWARE_RESTART.
#
# GCode reference
# ───────────────
#   ZFAILSAFE_STATUS                      — config + last SG per Z motor + state
#   ZFAILSAFE_ENABLE / ZFAILSAFE_DISABLE  — arm / disarm the failsafe
#   ZFAILSAFE_SET_THRESHOLD THRESHOLD=N [MOTOR=stepper_z]
#   ZFAILSAFE_RESET                       — clear latch after a non-shutdown hit


[z_home_failsafe]
# Z steppers to watch — list EVERY Z motor section (each needs a tmc5160 etc.).
motors: stepper_z, stepper_z1

# How often to read DRV_STATUS while Z is homing (seconds).  0.01 s = 100 Hz.
poll_interval: 0.01

# SG_RESULT at/under this = blocked rotor.  Keep it LOW (10–30): normal homing
# descent reads well above it; only a hard stop reaches it.  Per-motor overrides
# are available as block_threshold_stepper_z, block_threshold_stepper_z1, etc.
block_threshold: 20

# Consecutive below-threshold, still-stepping samples required to fire.  This
# must outlast a normal endstop stop (which sets standstill and clears the
# detector).  12 × 0.01 s = 120 ms; a real crash holds low SG far longer, so it
# always survives.  Raise if a normal home ever false-fires; lower for a faster
# cutoff on a real crash.
consecutive_triggers: 12

# Samples ignored at the very start of the homing move while Z accelerates up
# to homing speed (SG is unreliable below cruise).  15 × 0.01 s = 150 ms.
start_blank_samples: 15

# none           → log only (use this while tuning / verifying)
# m117           → show the hit on the display; does NOT stop motion
# pause          → run the PAUSE macro
# emergency_stop → immediate MCU shutdown (recommended for a crash failsafe)
action: emergency_stop

# Arm automatically.  The failsafe is only active during a Z homing move and is
# completely idle at all other times.
enabled: True
