[force_move]
enable_force_move: True

[save_variables]
filename: ~/printer_data/config/save_variables.cfg

[exclude_object]
[gcode_arcs]

#   Enable M118 command
[respond] 
[pause_resume]
recover_velocity: 50.0

# Moonraker Requirements
[display_status]
[virtual_sdcard]
path: ~/printer_data/gcodes

# ----- Archimajor Board Definitions -----
[mcu]
serial: /dev/serial/by-id/Serial_here
baud: 115200
[mcu archim1]
serial: /dev/serial/by-id/Serial_here
baud: 115200
[mcu archim2]
serial: /dev/serial/by-id/Serial_here
baud: 115200
[mcu archim3]
serial: /dev/serial/by-id/Serial_here
baud: 115200



#[include build/*.cfg]
[include GBHX/*.cfg]
[include timelapse.cfg]
[include *standalone.cfg]
[include *macros.cfg]
[include *shell_command.cfg]
