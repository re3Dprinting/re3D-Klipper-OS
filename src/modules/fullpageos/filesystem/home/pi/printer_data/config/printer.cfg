# Gigabot 4 / Archimajor: CoreXY bench test, X and Y motors only.
# Deliberately exclude generated machine configs, heaters, and print macros.
[include src/common/board_pinmap/archimajor_pinmap.cfg]
[include build/_serial.cfg]

# Bench diagnostics: permits declaring a position without physical homing.
[force_move]
enable_force_move: True

[printer]
kinematics: corexy
max_velocity: 50
max_accel: 300
minimum_cruise_ratio: 0.5
max_z_velocity: 10
max_z_accel: 30
square_corner_velocity: 5.0

# CoreXY belt motors are assigned by belt routing, not by endstop axis.
[stepper_x]
step_pin: YSTEP
dir_pin: !YDIR
enable_pin: !STEP_EN
microsteps: 16
rotation_distance: 60
endstop_pin: ^!XSTOP
position_endstop: 0
position_max: 590
homing_positive_dir: False
homing_speed: 10
homing_retract_dist: 5
homing_retract_speed: 10
second_homing_speed: 5

[stepper_y]
step_pin: XSTEP
dir_pin: !XDIR
enable_pin: !STEP_EN
microsteps: 16
rotation_distance: 60
endstop_pin: ^!YSTOP
position_endstop: 610
position_max: 610
homing_positive_dir: True
homing_speed: 10
homing_retract_dist: 5
homing_retract_speed: 10
second_homing_speed: 5

[tmc5160 stepper_x]
cs_pin: YCS
sense_resistor: 0.050
run_current: 1.4

[tmc5160 stepper_y]
cs_pin: XCS
sense_resistor: 0.050
run_current: 1.4

# CoreXY requires a Z rail. Leave this unused port unhomed, without a TMC driver.
[stepper_z]
step_pin: ZSTEP
dir_pin: !ZDIR
enable_pin: !STEP_EN
microsteps: 16
rotation_distance: 1.5875
endstop_pin: ^!ZSTOP
position_endstop: 0.3
position_max: 602

[homing_override]
axes: xyz
gcode:
    {% if 'Z' in params %}
        {action_raise_error("XY-only CoreXY bench: Z homing is disabled")}
    {% endif %}
    {% if 'X' in params %}
        G28 X
    {% endif %}
    {% if 'Y' in params %}
        G28 Y
    {% endif %}
    {% if 'X' not in params and 'Y' not in params %}
        G28 X Y
    {% endif %}

[exclude_object]
[gcode_arcs]

#   Enable M118 command
[respond] 
[pause_resume]
recover_velocity: 50.0

# Moonraker Requirements
[display_status]
[virtual_sdcard]
path: ~/printer_data/gcodes
