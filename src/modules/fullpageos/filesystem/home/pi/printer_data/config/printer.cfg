[force_move]
enable_force_move: True

[save_variables]
filename: ~/printer_data/config/save_variables.cfg

[exclude_object]
[gcode_arcs]

#   Enable M118 command
[respond] 
[pause_resume]
recover_velocity: 50.0

# Moonraker Requirements
[display_status]
[virtual_sdcard]
path: ~/printer_data/gcodes

# ----- Archimajor Board Definitions -----
[mcu]
serial: /dev/serial/by-id/usb-Klipper_sam3x8e_203220444D3246393035303037303232-if00
baud: 115200
[mcu archim1]
serial: /dev/serial/by-id/usb-Klipper_sam3x8e_203220444D3246393035303037303236-if00
baud: 115200
[mcu archim2]
serial: /dev/serial/by-id/usb-Klipper_sam3x8e_203220444D3246393230303037303139-if00
baud: 115200
[mcu archim3]
serial: /dev/serial/by-id/usb-Klipper_sam3x8e_203220444D3246393230303037303135-if00
baud: 115200



#[include build/*.cfg]
[include GBHX/*.cfg]
[include timelapse.cfg]
[include *standalone.cfg]
[include *macros.cfg]
[include *shell_command.cfg]

[printer]
kinematics: cartesian
max_velocity: 100
max_accel: 1000
minimum_cruise_ratio: 0.5
max_z_velocity: 10
max_z_accel: 30
square_corner_velocity: 5.0
