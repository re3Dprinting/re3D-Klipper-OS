[gcode_macro CANCEL_PRINT]
description: Cancels the current print and lowers the bed 30mm
rename_existing: BASE_CANCEL_PRINT
gcode:
    SAFE_LIFT_Z Z=30
    TURN_OFF_HEATERS
    CLEAR_PAUSE
    SDCARD_RESET_FILE
    BASE_CANCEL_PRINT

[gcode_macro PAUSE]
description: Pause the print and park the nozzle 
rename_existing: BASE_PAUSE
gcode:
    CLEAR_PAUSE
    SAVE_GCODE_STATE NAME=PAUSE_STATE
    BASE_PAUSE

[gcode_macro RESUME]
description: Resumes the print and restores the nozzle temperature
rename_existing: BASE_RESUME
gcode:
    M400
    RESTORE_GCODE_STATE NAME=PAUSE_STATE MOVE=1 MOVE_SPEED=80
    M400
    BASE_RESUME