# Dual-GBX board/driver specifics for the added zones (extruder3..extruder7).
# Enabled via dual_extruder_enabled=true in the [fgf] section of .master.cfg.
# Added to build/ only when the dual flag is set. Mirrors what
# board_specific/archimajor_specific.cfg + platform_specific do for the base
# extruder/extruder1/extruder2 zones.
#
# Assembly 1's extruder3 shares the ESTEP motor + ECS driver (no new driver).
# Assembly 2 (extruder4..extruder7) shares the E4STEP motor; extruder4 owns the
# enable pin + TMC5160 driver, the rest just add dir/sensor.

######################## ASSEMBLY 1 - ADDED ZONE ########################

[extruder3]
dir_pin: !EDIR
sensor_type: MAX31856

######################## ASSEMBLY 2 - MOTOR + ZONES ########################

[extruder4]
dir_pin: !E4DIR
enable_pin: !STEP_EN
sensor_type: MAX31856

[extruder5]
dir_pin: !E4DIR
sensor_type: MAX31856

[extruder6]
dir_pin: !E4DIR
sensor_type: MAX31856

[extruder7]
dir_pin: !E4DIR
sensor_type: MAX31856

[tmc5160 extruder4]
cs_pin: E4CS
sense_resistor: 0.050
run_current: 1.5
