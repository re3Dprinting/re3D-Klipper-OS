# stallguard_standalone.cfg
#
# Loaded via [include *standalone.cfg] — AFTER build/*.cfg — so these
# settings take final precedence.
#
# Requires ~/klipper/klippy/extras/stallguard_monitor.py (deployed by updater).
#
# TUNING WORKFLOW
# ───────────────
# 1. Leave collision_action: none and run a normal print.
# 2. Call  SG_STATUS  every few seconds to observe baseline SG_RESULT values.
#    Typical lightly-loaded moves: 300-800.  Near a true stall: < 50.
# 3. Manually push the carriage against a hard stop while moving slowly;
#    note how low the value drops.
# 4. Set collision_threshold between the "hard push" floor and the normal
#    baseline (e.g. 100-150 is a safe first guess for TMC5160 + Archimajor).
# 5. Bump consecutive_triggers if you see false positives on fast reversals.
# 6. Switch collision_action to  pause  when you're happy with the threshold.
#
# GCode reference
# ───────────────
#   SG_STATUS                              — print current SG_RESULT + threshold per motor
#   SG_START                               — enable monitoring (also clears latch)
#   SG_STOP                                — disable monitoring
#   SG_SET_THRESHOLD THRESHOLD=N           — set default threshold for all motors
#   SG_SET_THRESHOLD THRESHOLD=N MOTOR=stepper_x  — set threshold for one motor
#   SG_RESET                               — clear collision latch after clearing a jam
#   SG_CALIBRATE                           — move each axis and report baseline SG stats
#   SG_CALIBRATE DISTANCE=30 SPEED=40      — custom distance/speed for calibration run

[stallguard_monitor]
# Steppers to watch — must each have a tmc5160 / tmc2209 / etc. driver section.
motors: stepper_x, stepper_y, stepper_z

# How often to read DRVSTATUS (seconds).
#   0.10 s = 10 Hz  — default; safe for all machines
#   0.05 s = 20 Hz  — good balance for collision response
#   0.02 s = 50 Hz  — fastest useful; may add slight reactor load
# Collision latency = poll_interval × consecutive_triggers
#   e.g. 0.05 × 2 = 100 ms worst-case response time
poll_interval: 0.05

# SG_RESULT below this value counts as an overload sample (0-1023).
# Observed normal movement baseline on Archimajor TMC5160:
#   stepper_z: 69–88 (10th–90th pct)   stepper_x/y: 83–116
# True stall drops to near-zero.  Keep threshold below the motor with
# the lowest normal baseline (stepper_z ~69) to avoid false triggers.
# Use SG_CALIBRATE to measure baselines and tune these per-motor values.
collision_threshold: 40

# Per-motor overrides — comment out to use the default above for all.
# Run SG_CALIBRATE to get fresh baseline numbers, then set each to
# roughly (mean - 2*stddev) from the calibration output.
collision_threshold_stepper_x: 50
collision_threshold_stepper_y: 50
collision_threshold_stepper_z: 35

# How many consecutive overload samples before the action fires.
# Lower = faster response; higher = fewer false positives on reversals.
# At poll_interval=0.05: value of 2 = 100 ms, value of 3 = 150 ms
consecutive_triggers: 2

# none  → log only (use while tuning)
# pause → run PAUSE macro  (safe choice for homing — stops the move)
# emergency_stop → immediate MCU shutdown
collision_action: pause

# Set False here to deploy silently and enable later with SG_START.
enabled: True

# Only arm during G28 homing moves; automatically disarms when homing finishes.
# Set False to monitor continuously (original behaviour).
homing_only: True

# Belt calibration: distance and speed for SG_CALIBRATE moves.
# SG_CALIBRATE will move each axis +DISTANCE then back at SPEED and report
# mean/stddev/min/max SG values.  Use the output to tune per-motor thresholds.
calibrate_distance: 20
calibrate_speed: 50


# ── Macros ───────────────────────────────────────────────────────────────────

# Fires after PAUSE clears the jam; re-arms monitoring before resuming.
# standalone.cfg loads after build/*.cfg, so this definition wins.
[gcode_macro RESUME]
rename_existing: RESUME_BASE
description: Resume print and re-arm StallGuard monitoring
gcode:
    SG_RESET
    RESUME_BASE {rawparams}

# Quick helper: temporarily switch to logging-only mode for threshold tuning.
[gcode_macro SG_TUNE_MODE]
description: Disable collision action so SG_STATUS can be used safely during a move
gcode:
    SG_SET_THRESHOLD THRESHOLD=0
    SG_STOP
    M118 StallGuard: tuning mode — use SG_STATUS to read values, then SG_SET_THRESHOLD THRESHOLD=<value> and SG_START


# ── Live watch loop ───────────────────────────────────────────────────────────
# SG_WATCH          start printing SG_STATUS to console every second
# SG_WATCH RATE=2   print every 2 seconds (0.5 – 10 s)
# SG_WATCH_STOP     stop the loop

[delayed_gcode _sg_watch_loop]
gcode:
    SG_STATUS

[gcode_macro SG_WATCH]
description: Print SG_STATUS to console on a repeating timer (default every 1 s)
gcode:
    {% set rate = params.RATE|default(1)|float %}
    {% if rate < 0.5 %}{% set rate = 0.5 %}{% endif %}
    {% if rate > 10 %}{% set rate = 10 %}{% endif %}
    UPDATE_DELAYED_GCODE ID=_sg_watch_loop DURATION={rate}
    M118 SG_WATCH started (every {rate}s) — run SG_WATCH_STOP to stop

[gcode_macro SG_WATCH_STOP]
description: Stop the SG_STATUS live watch loop
gcode:
    UPDATE_DELAYED_GCODE ID=_sg_watch_loop DURATION=0
    M118 SG_WATCH stopped
