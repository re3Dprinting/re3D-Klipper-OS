# stallguard_standalone.cfg
#
# Loaded via [include *standalone.cfg] — AFTER build/*.cfg — so these
# settings take final precedence.
#
# Requires ~/klipper/klippy/extras/stallguard_monitor.py (deployed by updater).
#
# PURPOSE
# ───────
# Print-collision detection ONLY.  It is muted during homing (G28) and only
# looks at the motors while they are actually cruising during a normal/printing
# move.  A physical collision blocks the rotor, so SG_RESULT collapses to ~0 at
# any speed; normal motion (fast travel, slow perimeters, corners) stays well
# above a low threshold.  Three mechanisms remove the usual false triggers:
#
#   1. Homing suppression — endstop loading never looks like a stall.
#   2. Velocity gate (min_speed_mm_s) — SG is skipped while the live planner
#      velocity is below the gate, which covers BOTH the acceleration and the
#      deceleration parts of every move (the unreliable low-speed regions).
#   3. Low threshold + consecutive samples — only a blocked rotor reaches the
#      threshold, confirmed N times in a row; the window clears the instant SG
#      recovers, so direction/speed changes never accumulate.
#
# ── Per-TMC driver settings (add to each [tmc5160 stepper_x] block, etc.) ────
#   driver_SGT:       0    # stall sensitivity (-64..63, lower = more sensitive)
#   driver_SFILT:     1    # 4-full-step hardware filtering — smoother SG
#   driver_TCOOLTHRS: 500  # optional hardware speed gate (belt-and-suspenders)
#
# TUNING (no false triggers, no missed stalls)
# ────────────────────────────────────────────
#   1. Set  collision_action: none   (log only) and reload.
#   2. SG_TRACE_START , then run a normal print (or SG_CALIBRATE).  Note the
#      LOWEST SG seen during real moves above the velocity gate.
#   3. Set collision_threshold to roughly HALF that minimum (keep it low,
#      typically 10–30).  Set min_speed_mm_s just below your slowest real
#      printing speed.
#   4. Hand-block an axis mid-move to confirm it fires, then switch
#      collision_action back to pause (or emergency_stop).
#
# GCode reference
# ───────────────
#   SG_STATUS                              — SG_RESULT + threshold per motor
#   SG_START / SG_STOP                     — enable / disable monitoring
#   SG_SET_THRESHOLD THRESHOLD=N           — set threshold for all motors
#   SG_SET_THRESHOLD THRESHOLD=N MOTOR=stepper_x — set one motor
#   SG_SET_SPEED SPEED=N                   — change the velocity gate (mm/s)
#   SG_RESET                               — clear collision latch after a jam
#   SG_CALIBRATE [DISTANCE=30 SPEED=40]    — move each axis, report SG stats
#   SG_DIAG                                — check register read + velocity source
#   SG_TRACE_START [FILE=/path/file.csv]   — start CSV motion trace
#   SG_TRACE_STOP                          — stop trace and close file


[stallguard_monitor]
# Steppers to watch — each must have a tmc5160 / tmc2209 / etc. driver section.
motors: stepper_x, stepper_y, stepper_y1

# How often to read DRVSTATUS (seconds).  Collision latency ≈ poll × window.
#   0.02 s = 50 Hz  → 0.02 × 3 = 60 ms worst-case response.
poll_interval: 0.02

# SG_RESULT threshold — set this LOW (10–30).
# A blocked rotor reads SG near 0 at any speed; normal motion stays well above.
# Start at 20, then tune down/up using SG_CALIBRATE / SG_TRACE_START output.
collision_threshold: 20
collision_threshold_stepper_x: 20
collision_threshold_stepper_y: 20
collision_threshold_stepper_y1: 20

# Consecutive below-threshold samples required to fire (AFTER the pre-stall
# blank below).  The window clears whenever SG rises back above the threshold,
# so speed/direction changes can never accumulate toward a false trigger.
consecutive_triggers: 3

# Pre-stall blank — the PRIMARY decel/end-of-move false-trigger fix.
# When SG first drops below the threshold, this many polls are waited out
# before counting toward a trigger.  SG_RESULT and the standstill (STST) flag
# come from the SAME register read, so they are perfectly time-aligned — unlike
# the [motion_report] velocity feed, which can lag the motor by 100s of ms and
# therefore cannot reliably gate decels on its own.  On a normal stop the motor
# reaches standstill during this blank (window clears → no fire); a real
# collision keeps stepping (STST never sets) so it survives the blank and fires.
# Total detection latency = (pre_stall_blank + consecutive_triggers) × poll.
#   8 + 3 = 11 × 0.02 s ≈ 220 ms.  Raise if decel false triggers persist;
#   lower for faster response.
pre_stall_blank_samples: 8

# Velocity gate (mm/s).  SG is only evaluated while the live planner velocity
# (from [motion_report]) is at or above this.  This is the key false-trigger
# fix: it skips the low-speed accel ramp-up AND decel ramp-down of every move,
# plus all standstill samples.  Set it just BELOW your slowest real printing
# speed.  Set 0 to disable (not recommended).
min_speed_mm_s: 20

# Samples discarded each time an axis first crosses the velocity gate, to let
# SG settle after the speed ramps up.  3 × 0.02 s = 60 ms.
accel_blank_samples: 3

# Steady-velocity gate (mm/s²).  SG is skipped whenever the toolhead is
# accelerating OR decelerating faster than this.  This is the fix for decel
# false triggers: during hard deceleration the motor is back-driven and
# SG_RESULT briefly collapses to ~0 even though the axis is still moving fast.
# Cruise has ~0 acceleration, so collisions (which happen at steady commanded
# speed) are still caught.  Lower = more aggressive gating / fewer false
# triggers; raise it if real collisions during ramps go undetected.  0 = off.
max_accel_mm_s2: 500

# none           → log to console only (use this while tuning)
# m117           → show the hit on the printer display; does NOT stop motion
#                  (handy for testing detection without interrupting a print)
# pause          → run the PAUSE macro
# emergency_stop → immediate MCU shutdown
collision_action: pause

# Start monitoring automatically when Klipper is ready.  Monitoring is muted
# automatically during G28 and resumes when homing finishes.
enabled: True

# SG_CALIBRATE move distance/speed.  SG_CALIBRATE moves each axis +DISTANCE
# then back at SPEED and reports mean/stddev/min/max SG plus a suggested
# threshold (about half the minimum SG seen).
calibrate_distance: 20
calibrate_speed: 50

# Optional CSV trace — set a path to auto-start at boot, or use SG_TRACE_START.
#   columns: time_s, motor, sg, threshold, window_avg, window_n,
#            vel_mms, pos_x, pos_y, pos_z, state
#   state codes: M=normal(>=thresh), G=below_thresh, A=accel_blank,
#                V=vel_gated, D=accel/decel_gated, C=collision
# trace_file: /home/pi/printer_data/logs/stallguard_trace.csv


# ── Macros ───────────────────────────────────────────────────────────────────

# Re-arm the collision latch when a paused print resumes.
[gcode_macro RESUME]
rename_existing: RESUME_BASE
description: Resume print and re-arm StallGuard monitoring
gcode:
    SG_RESET
    RESUME_BASE {rawparams}

# Temporarily switch to logging-only so SG_STATUS can be read safely mid-move.
[gcode_macro SG_TUNE_MODE]
description: Stop collision action so SG values can be observed during a move
gcode:
    SG_STOP
    M118 StallGuard: tuning mode — use SG_TRACE_START / SG_STATUS, then SG_START to re-arm


# ── Live watch loop ───────────────────────────────────────────────────────────
# SG_WATCH          print SG_STATUS to console every second
# SG_WATCH RATE=2   print every 2 seconds (0.5 – 10 s)
# SG_WATCH_STOP     stop the loop

[delayed_gcode _sg_watch_loop]
gcode:
    SG_STATUS

[gcode_macro SG_WATCH]
description: Print SG_STATUS to console on a repeating timer (default every 1 s)
gcode:
    {% set rate = params.RATE|default(1)|float %}
    {% if rate < 0.5 %}{% set rate = 0.5 %}{% endif %}
    {% if rate > 10 %}{% set rate = 10 %}{% endif %}
    UPDATE_DELAYED_GCODE ID=_sg_watch_loop DURATION={rate}
    M118 SG_WATCH started (every {rate}s) — run SG_WATCH_STOP to stop

[gcode_macro SG_WATCH_STOP]
description: Stop the SG_STATUS live watch loop
gcode:
    UPDATE_DELAYED_GCODE ID=_sg_watch_loop DURATION=0
    M118 SG_WATCH stopped
