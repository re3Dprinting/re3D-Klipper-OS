# stallguard_standalone.cfg
#
# Loaded via [include *standalone.cfg] — AFTER build/*.cfg — so these
# settings take final precedence.
#
# Requires ~/klipper/klippy/extras/stallguard_monitor.py (deployed by updater).
#
# OVERVIEW
# ────────
# Two proven profiles.  Choose one and leave the other commented out.
#
#  PROFILE A — Homing failsafe  (active below, detection_mode: absolute)
#  ────────────────────────────────────────────────────────────────────────
#  Monitors ONLY during G28.  Absolute threshold tuned to homing speed.
#  Very reliable; no false triggers; catches endstop-less hard stops.
#  Tune:  run SG_CALIBRATE at your homing speed, set per-motor thresholds
#         to (mean - 3*stddev) from the output.
#
#  PROFILE B — Print crash / complete stall  (detection_mode: absolute,
#                                              homing_only: False, low threshold)
#  ────────────────────────────────────────────────────────────────────────
#  Monitors continuously during printing.  Uses a very LOW absolute threshold
#  (5-15) that is only ever reached when the motor is truly blocked — SG_RESULT
#  drops to near-zero at any speed when a physical obstruction stalls the rotor.
#  Normal moves at any speed (fast travel, slow perimeter, corner deceleration)
#  all stay above 50.  This avoids the speed-transition false triggers that
#  plague adaptive/EWMA-based detection.
#  Tune:  set collision_threshold: 5, consecutive_triggers: 8, test by hand.
#
#  WHY NOT ADAPTIVE MODE FOR PRINTING?
#  TMC5160 SG_RESULT is speed-dependent — the same physical load gives
#  different readings at different velocities.  Adaptive mode now uses
#  freeze-on-drop: the baseline freezes the moment SG falls below the
#  detection trigger, preventing the EWMA from adapting to the stall load.
#  This makes adaptive mode viable for forced stalls (homing, print crash).
#  However, SG is still speed-dependent during normal moves, so false triggers
#  on rapid speed transitions are still possible.  Absolute mode with a
#  near-zero threshold remains the most reliable choice for continuous print
#  monitoring at variable speeds.
#
# GCode reference
# ───────────────
#   SG_STATUS                              — print current SG_RESULT + threshold per motor
#   SG_START                               — enable monitoring (also clears latch)
#   SG_STOP                                — disable monitoring
#   SG_SET_THRESHOLD THRESHOLD=N           — set default threshold for all motors
#   SG_SET_THRESHOLD THRESHOLD=N MOTOR=stepper_x  — set threshold for one motor
#   SG_RESET                               — clear collision latch after clearing a jam
#   SG_CALIBRATE                           — move each axis and report baseline SG stats
#   SG_CALIBRATE DISTANCE=30 SPEED=40      — custom distance/speed for calibration run
#   SG_DIAG                                — check register read path and toolhead velocity
#   SG_TRACE_START [FILE=/path/to/file.csv]— start CSV motion trace (time/pos/vel/SG per sample)
#   SG_TRACE_STOP                          — stop trace and close file

[stallguard_monitor]
# Steppers to watch — must each have a tmc5160 / tmc2209 / etc. driver section.
motors: stepper_x, stepper_y, stepper_y1

# How often to read DRVSTATUS (seconds).
#   0.10 s = 10 Hz  — default; safe for all machines
#   0.05 s = 20 Hz  — good balance for collision response
#   0.02 s = 50 Hz  — fastest useful; may add slight reactor load
# Collision latency = poll_interval × consecutive_triggers
#   e.g. 0.02 × 2 = 40 ms worst-case response time
poll_interval: 0.02

# SG_RESULT below this value counts as an overload sample (0-1023).
#
# PROFILE A (homing failsafe, homing_only: True):
#   SG is only sampled at a single, known homing speed, so an absolute
#   threshold is meaningful.  Run SG_CALIBRATE at homing speed and set
#   each motor to (mean - 3*stddev).  Values below reflect Archimajor TMC5160
#   at calibrate_speed: 50.  Tune if homing speed changes.
#
# PROFILE B (print crash, homing_only: False):
#   Use a near-zero threshold: a truly blocked motor reads 0-10 at any speed.
#   Normal moves at any speed stay above 50.  Recommended starting values:
#     collision_threshold: 5 (all motors)   consecutive_triggers: 8
# In adaptive mode, collision_threshold is the fallback used only during
# warmup (before the baseline seeds).  Set 0 to rely entirely on per-motor
# overrides or to make warmup-period triggers obvious.
collision_threshold: 0

# Per-motor overrides.  In adaptive mode these are the warmup-period fallback
# thresholds.  Once the baseline is established the drop_fraction is used.
collision_threshold_stepper_x: 15
collision_threshold_stepper_y: 15
collision_threshold_stepper_y1: 15

# Window size for rolling-average detection.
# With freeze-on-drop (adaptive mode): the window is reset the first time SG
# drops below the detection trigger.  Detection only fires once the window
# accumulates consecutive_triggers samples *after* that first drop.
# • Probe/mesh decel: 1 sub-trigger sample before STST latches → resets before
#   the window fills → NO false trigger.
# • Forced stall (motor blocked): many sub-trigger samples + oscillation spikes.
#   The window accumulates low/spike/low values — average still fires because
#   the baseline is FROZEN at its last-good value, keeping trigger level high.
#   Typical fire: samples [44, 32, 107] avg=61 < trigger=68.9 at t+40 ms.
# 3 samples × 0.02 s = 60 ms worst-case latency.
consecutive_triggers: 3

# Samples to discard after standstill clears (acceleration blanking).
# StallGuard reads are unreliable during initial acceleration (low velocity).
# These samples are ignored entirely — not added to the detection window.
#   e.g. 8 × 0.02 s = 160 ms of blanking after each move start
accel_blank_samples: 8

# none  → log only (use while tuning)
# pause → run PAUSE macro  (safe choice for homing — stops the move)
# emergency_stop → immediate MCU shutdown
collision_action: emergency_stop

# Set False here to deploy silently and enable later with SG_START.
enabled: True

# Only arm during G28 homing moves; automatically disarms when homing finishes.
# Set False to monitor continuously (original behaviour).
homing_only: False

# Belt calibration: distance and speed for SG_CALIBRATE moves.
# SG_CALIBRATE will move each axis +DISTANCE then back at SPEED and report
# mean/stddev/min/max SG values.  Use the output to tune per-motor thresholds.
calibrate_distance: 20
calibrate_speed: 50

# ── Detection mode ───────────────────────────────────────────────────────────
#
# absolute  — compare rolling-average SG to a fixed per-motor threshold.
#             Works for BOTH profiles.  The only reliable choice for
#             continuous print monitoring because SG_RESULT is speed-
#             dependent and EWMA baselines cannot track speed changes
#             fast enough without also tracking real collision drops.
#
# adaptive  — EWMA baseline; triggers when SG drops by drop_fraction
#             relative to its running average.  Useful only at constant
#             speed (e.g. a single conveyor-type axis).  Not recommended
#             for variable-speed 3D printing — false triggers on every
#             speed transition are unavoidable at any alpha setting.

detection_mode: adaptive

# Velocity gate: skip SG samples when the toolhead's commanded speed is below
# this value (mm/s).  Covers both acceleration AND deceleration phases because
# it reads Klipper's own planner velocity.
# NOTE: requires Klipper to expose 'velocity' in toolhead status.  If your
# build does not (check with SG_DIAG), leave this at 0 and rely solely on
# accel_blank_samples for acceleration blanking.
#   0 = disabled (default — safe for all builds)
min_speed_mm_s: 6

# Adaptive mode parameters (only used when detection_mode: adaptive)
# baseline_alpha      — EWMA smoothing factor for rising load (speed increases).
#                       Lower = slower adaptation.  Typical: 0.05-0.15
# baseline_alpha_fall — EWMA smoothing factor for falling load (speed reductions).
#                       Higher = faster downward tracking so the trigger level
#                       catches up quickly after a move from fast to slow.
#                       Default = 3 × baseline_alpha (capped at 0.5).
# baseline_guard      — Legacy deep-freeze threshold (SG < guard × baseline).
#                       With freeze-on-drop this is superseded: the baseline
#                       now freezes whenever SG drops below the detection
#                       trigger (baseline × (1 − drop_fraction)), which is a
#                       higher — and more useful — threshold than baseline_guard.
#                       Kept for backwards compatibility; does not affect
#                       detection behaviour when drop_fraction ≥ 1 − guard
#                       (which is true for all typical settings).
# baseline_shift_clear— When the EWMA baseline shifts by more than this fraction
#                       in a single sample (during normal above-trigger motion),
#                       clear the detection window.  Prevents false triggers while
#                       the baseline is still catching up after a speed change.
#                       With freeze-on-drop: shift-clear only fires in the
#                       above-trigger path; it can no longer fire during stalls
#                       (the baseline is frozen during sub-trigger events so the
#                       shift is zero).  Default 0.15; set to 0 to disable.
# pre_stall_blank_samples
#                     — After SG first drops below the detection trigger
#                       (entering the freeze-on-drop zone), suppress the
#                       detection window for this many additional samples.
#                       Purpose: absorb the low-SG samples that appear near
#                       zero velocity during a normal decel-to-stop (bed mesh
#                       probe points, end-of-move stops).  During a planned
#                       stop STST latches within ~20-80 ms; the standstill
#                       handler fires during the blank and resets everything →
#                       no trigger.  During a FORCED STALL Klipper keeps
#                       sending step pulses; STST does not latch; the blank
#                       expires and detection fires on the frozen-baseline
#                       window → TRIGGER.
#                       5 × 0.02 s = 100 ms blank.  Covers decels from up to
#                       ~150 mm/s at typical 1500-3000 mm/s² accelerations.
#                       Total worst-case stall detection latency:
#                         blank (100 ms) + window fill (60 ms) = ~160 ms.
baseline_alpha: 0.15
baseline_alpha_fall: 0.50
baseline_guard: 0.15
baseline_shift_clear: 0.15
pre_stall_blank_samples: 5
# drop_fraction       — fraction below baseline that triggers.  0.40 = 40 % drop.
#                       Lower = more sensitive; higher = fewer false positives.
drop_fraction: 0.40

# stall_zero_count  — trigger after this many consecutive SG=0 samples past
#                     the velocity gate and accel blank.  SG_RESULT=0 at speed
#                     means the rotor is fully locked; it is rare during normal
#                     motion on a properly tuned TMC.  Set to 0 to disable.
#                     Recommended starting value if hard stalls go undetected:
#                       stall_zero_count: 8   (8 × 0.02 s = 160 ms of zeros)
stall_zero_count: 0

# trace_file  — optional path to auto-start a CSV motion trace on boot.
#               Every non-standstill poll sample is logged with:
#                 time_s, motor, sg, baseline, trigger, window_avg,
#                 window_n, vel_mms, pos_x, pos_y, pos_z, state
#               state codes: M=moving, G=guard_zone, A=accel_blank,
#                             V=vel_gated, C=collision
#               At 50 Hz × 3 motors ≈ 150 rows/s — use only while debugging.
#               Start/stop at runtime with SG_TRACE_START / SG_TRACE_STOP.
# trace_file: /home/pi/printer_data/logs/stallguard_trace.csv


# ── Macros ───────────────────────────────────────────────────────────────────

# Fires after PAUSE clears the jam; re-arms monitoring before resuming.
# standalone.cfg loads after build/*.cfg, so this definition wins.
[gcode_macro RESUME]
rename_existing: RESUME_BASE
description: Resume print and re-arm StallGuard monitoring
gcode:
    SG_RESET
    RESUME_BASE {rawparams}

# Quick helper: temporarily switch to logging-only mode for threshold tuning.
[gcode_macro SG_TUNE_MODE]
description: Disable collision action so SG_STATUS can be used safely during a move
gcode:
    SG_SET_THRESHOLD THRESHOLD=0
    SG_STOP
    M118 StallGuard: tuning mode — use SG_STATUS to read values, then SG_SET_THRESHOLD THRESHOLD=<value> and SG_START


# ── Live watch loop ───────────────────────────────────────────────────────────
# SG_WATCH          start printing SG_STATUS to console every second
# SG_WATCH RATE=2   print every 2 seconds (0.5 – 10 s)
# SG_WATCH_STOP     stop the loop

[delayed_gcode _sg_watch_loop]
gcode:
    SG_STATUS

[gcode_macro SG_WATCH]
description: Print SG_STATUS to console on a repeating timer (default every 1 s)
gcode:
    {% set rate = params.RATE|default(1)|float %}
    {% if rate < 0.5 %}{% set rate = 0.5 %}{% endif %}
    {% if rate > 10 %}{% set rate = 10 %}{% endif %}
    UPDATE_DELAYED_GCODE ID=_sg_watch_loop DURATION={rate}
    M118 SG_WATCH started (every {rate}s) — run SG_WATCH_STOP to stop

[gcode_macro SG_WATCH_STOP]
description: Stop the SG_STATUS live watch loop
gcode:
    UPDATE_DELAYED_GCODE ID=_sg_watch_loop DURATION=0
    M118 SG_WATCH stopped
