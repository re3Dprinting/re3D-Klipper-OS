# All the configuration settings for the cutting/clamping mechanisms

# ----- U-Axis Motor -----
#[manual_stepper u_axis]
#step_pin: M5STEP
#dir_pin: M5DIR
#enable_pin: !M_EN
#microsteps: 16
#rotation_distance: 20
#velocity: 300
#accel: 300
#endstop_pin: ^!ES7
#position_min: 0
#position_max: 300

# ----- Linear Actuators -----
#[servo cutter]
#pin:
#maximum_servo_angle: 180
#minimum_pulse_width: 0.001
#maximum_pulse_width: 0.002


#[servo clamper]
#pin:
#maximum_servo_angle: 180
#minimum_pulse_width: 0.001
#maximum_pulse_width: 0.002


# ----- Cutter Heaters -----

[heater_generic cutter_heater]
heater_pin: archim3:HE1
sensor_type: MAX31856
sensor_pin: archim3:TC1
control: pid
pid_Kp: 777
pid_Ki: 777
pid_Kd: 777
min_temp: 0
max_temp: 380

[heater_generic cutter_heater1]
heater_pin: archim3:HE2
sensor_type: MAX31856
sensor_pin: archim3:TC2
control: pid
pid_Kp: 777
pid_Ki: 777
pid_Kd: 777
min_temp: 0
max_temp: 380

# ----- Cutting/Clamping Operation -----

[gcode_macro LAY_WIRE]
gcode:
    # psuedo code for laying wire
    move u-Axis
    extrude wire 
    clamp 
    move back
    cut 
