# stallguard_monitor.cfg
#
# StallGuard collision detection for TMC-driven motors.
# Requires ~/klipper/klippy/extras/stallguard_monitor.py to be installed.
#
# ── How it works ─────────────────────────────────────────────────────────────
#  The extra polls each TMC driver's DRVSTATUS register every `poll_interval`
#  seconds.  From that register it reads:
#    • SG_RESULT (bits 9:0) – StallGuard result; range 0-1023.
#                             LOW values = HIGH load.  0 ≈ stalled.
#    • STST      (bit  31)  – Standstill flag; 1 when motor is stopped.
#
#  When a motor is moving (STST == 0) and SG_RESULT drops below
#  `collision_threshold` for `consecutive_triggers` polls in a row, the
#  configured `collision_action` is executed and a latch is set.
#  Issue SG_RESET (or SG_START) to re-arm monitoring after clearing the jam.
#
# ── Tuning threshold ─────────────────────────────────────────────────────────
#  1. Start a print (or run a move).
#  2. Run  SG_STATUS  repeatedly to observe normal SG_RESULT values.
#     Typical idle-move values will be in the 200-800 range depending on
#     motor current, speed, and mechanical load.
#  3. Set collision_threshold well below the normal-move values but above
#     the value you see when manually pressing against the carriage.
#  4. Lower  consecutive_triggers  for faster response; raise it to reduce
#     false positives on direction reversals or acceleration transients.
#
# ── Available GCode commands ─────────────────────────────────────────────────
#  SG_STATUS                     Print current SG_RESULT for all motors
#  SG_START                      Enable monitoring (re-arms after collision)
#  SG_STOP                       Disable monitoring
#  SG_SET_THRESHOLD THRESHOLD=N  Change threshold live (0-1023)
#  SG_RESET                      Clear collision latch without restarting
#
# ── Moonraker template variable ──────────────────────────────────────────────
#  printer['stallguard_monitor'].sg_values        dict of motor -> last SG_RESULT
#  printer['stallguard_monitor'].collision_detected  True after a collision
# ─────────────────────────────────────────────────────────────────────────────

[stallguard_monitor]

# Comma-separated list of steppers that have TMC drivers.
# The extra will search for tmc5160 <motor>, tmc2209 <motor>, etc.
motors: stepper_x, stepper_y, stepper_z

# Seconds between register reads (0.05 – 5.0).
# 0.1 s gives 10 Hz resolution; sufficient for most collision scenarios.
poll_interval: 0.1

# SG_RESULT below this value is treated as an overload reading.
# TMC5160 SG4 range: 0-1023.  Start conservative (100) and tune upward
# until you stop getting false positives on normal moves.
collision_threshold: 100

# How many consecutive below-threshold polls must occur before the action
# fires.  Reduces false positives on hard direction reversals.
consecutive_triggers: 3

# What to do when a collision is detected:
#   none           – log the event only (good for tuning)
#   pause          – run PAUSE macro (default)
#   emergency_stop – immediate MCU shutdown (use with caution)
collision_action: pause

# Set to False to load the config without activating monitoring.
# Use SG_START / SG_STOP in macros to control it.
enabled: True


# ── Helper macro ─────────────────────────────────────────────────────────────
# Attach SG_RESET to your RESUME macro so monitoring re-arms automatically
# after the operator clears the jam.

[gcode_macro RESUME]
rename_existing: RESUME_BASE
description: Resume print and re-arm StallGuard monitoring
gcode:
    SG_RESET
    RESUME_BASE {rawparams}
