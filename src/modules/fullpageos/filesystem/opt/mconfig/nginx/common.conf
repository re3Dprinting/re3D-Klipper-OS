ssl_certificate /etc/re3d-auth/tls.crt;
ssl_certificate_key /etc/re3d-auth/tls.key;
ssl_protocols TLSv1.2 TLSv1.3;

sub_filter '</body>' '<script src="/auth/kiosk-client.js"></script></body>';
sub_filter_once on;
proxy_set_header Accept-Encoding "";

auth_request /_re3d_auth;
auth_request_set $re3d_https_required $upstream_http_x_re3d_https_required;
error_page 401 = @re3d_login;

location @re3d_login {
    add_header Cache-Control "no-store" always;
    if ($re3d_https_required) {
        return 307 https://$host:$re3d_tls_port$request_uri;
    }
    return 302 /auth/login;
}

location = /_re3d_auth {
    internal;
    auth_request off;
    proxy_pass http://127.0.0.1:8090/auth/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_intercept_errors off;
}

location ^~ /auth/ {
    auth_request off;
    client_max_body_size 8k;
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Re3D-HTTPS-Origin https://$host:$re3d_tls_port;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
}
