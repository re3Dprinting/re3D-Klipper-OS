<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=1024, initial-scale=1"/>
<title>Machine Configurator (Modular Tabs)</title>

<!-- Kill caching while testing -->
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<style>
  /* ── Global style-guide tokens ─────────────────────────────────────────── */
  :root{
    --brand:#FFD400; --brand-600:#FFC800; --brand-700:#FFBD00; --brand-800:#FFB300;
    --white:#FFFFFF; --gray-050:#F2F2F2; --gray-100:#E6E6E6; --gray-200:#D9D9D9;
    --gray-300:#CCCCCC; --gray-400:#BCBEC0; --gray-800:#393B3E; --gray-850:#2B2E33;
    --gray-900:#1C1C1E; --gray-950:#111112; --near-black:#111112; --black:#000000;

    --bg:#111112;
    --panel:#303133;
    --panel-outer:#1C1C1E;
    --border:#393B3E;
    --fg:#F2F2F2;
    --muted:#BCBEC0;

    --radius:10px; --pad:14px;
    --focus-ring:0 0 0 2px rgba(255,212,0,.35);
    --card-shadow:3px 3px 0px 0px #000, -0.5px -0.5px 0px 0px #393b3e;

    --success:#22c55e; --success-bg:rgba(34,197,94,.1); --success-border:rgba(34,197,94,.3);
    --warn:#f97316;   --warn-bg:rgba(249,115,22,.1);  --warn-border:rgba(249,115,22,.3);
    --error:#ef4444;  --error-bg:rgba(239,68,68,.08);  --error-border:rgba(239,68,68,.3);
  }

  /* ── Global base / layout ──────────────────────────────────────────────── */
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.35 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,"Helvetica Neue",Arial,sans-serif;
    text-rendering:optimizeLegibility; -webkit-font-smoothing:antialiased;
  }
  [hidden]{display:none!important}

  .wrap{width:100%;max-width:980px;margin:0 auto;padding:12px}

  .app{
    display:grid;gap:12px;
    grid-template-rows:56px auto;
    min-height:100dvh;
    align-content:start;
  }

  /* ── Global tabs/nav ───────────────────────────────────────────────────── */
  .tabs{
    position:relative;z-index:10;
    display:flex;align-items:center;gap:8px;
    padding:6px;background:#000;border:none;
    border-radius:var(--radius);
    box-shadow:var(--card-shadow);
    overflow-x:auto;overflow-y:hidden;
    -webkit-overflow-scrolling:touch;
    scroll-behavior:smooth;
  }
  .tabs > *{flex-shrink:0}

  .tab{
    appearance:none;border:1px solid transparent;background:#262628;
    color:var(--fg);padding:10px 14px;border-radius:8px;cursor:pointer;user-select:none;
    font-weight:700;letter-spacing:.2px;text-decoration:none;display:inline-block;
    transition:background .12s ease, border-color .12s ease, box-shadow .12s ease, color .12s ease, opacity .12s ease, filter .12s ease;
  }
  .tab:hover{background:#393B3E}
  .tab:focus-visible{outline:none;box-shadow:var(--focus-ring)}
  .tab.active{background:var(--brand);border-color:var(--brand-700);color:#000}

  .tabs .spacer{flex:1}
  .tabs .divider{width:1px;height:32px;background:#393B3E;border-radius:1px}
  .tab.cta{
    background:var(--brand);border-color:var(--brand-700);color:#000;
    font-size:15px;padding:12px 18px;font-weight:900;
    box-shadow:2px 2px 0px 0px rgb(0 0 0 / 30%), -0.5px -0.5px 0px 0px #feeb33;
  }
  .tab.cta:hover{background:var(--brand-600)}
  .tab.cta:active{background:var(--brand-700);transform:translateY(1px)}
  .tab.cta:focus-visible{outline:none;box-shadow:var(--focus-ring)}

  /* ── Global page background card & utilities ───────────────────────────── */
  .pages{
    background:var(--panel-outer);border:none;border-radius:var(--radius);
    padding:14px;display:grid;grid-template-rows:auto auto;align-content:start;align-items:start;
    box-shadow:var(--card-shadow);
  }
  .page-title{
    font-size:16px;font-weight:800;color:var(--fg);display:flex;align-items:center;gap:10px;
    padding-bottom:8px;border-bottom:2px solid var(--brand);margin-bottom:4px;
  }
  .page-host{margin-top:8px}

  /* Useful shared utilities tabs can reuse */
  .card{border:none;border-radius:10px;background:var(--panel);padding:12px;box-shadow:var(--card-shadow)}
  .row{display:grid;gap:8px;grid-template-columns:1fr 1fr}
  label{color:var(--muted);font-size:12px}
  input,select{
    width:100%;padding:10px 12px;border-radius:8px;border:1px solid #262628;
    background:#1C1C1E;color:var(--fg);transition:border-color .12s ease, box-shadow .12s ease;
  }
  input:focus-visible,select:focus-visible{outline:none;border-color:var(--brand-700);box-shadow:var(--focus-ring)}
  button{
    border:0;padding:10px 14px;border-radius:8px;background:var(--brand);
    color:#000;font-weight:900;cursor:pointer;letter-spacing:.2px;
    box-shadow:2px 2px 0px 0px rgb(0 0 0 / 30%), -0.5px -0.5px 0px 0px #feeb33;
    transition:transform .06s ease, background .12s ease, box-shadow .12s ease;
  }
  button:hover{background:var(--brand-600)}
  button:active{transform:translateY(1px);background:var(--brand-700)}
  button:focus-visible{outline:none;box-shadow:var(--focus-ring)}
  .btn-ghost{background:#262628;color:var(--fg);box-shadow:2px 2px 0px 0px rgb(0 0 0 / 30%), -0.5px -0.5px 0px 0px #666868}
  .btn-ghost:hover{background:#393B3E}
  .hint{color:var(--muted);font-size:12px}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .btn-row{display:flex;align-items:center;justify-content:flex-end;gap:8px}

  /* Spinner (global) */
  .spinner{
    width:14px;height:14px;border:2px solid rgba(255,255,255,0.12);border-top-color:var(--brand);
    border-radius:50%;display:inline-block;vertical-align:middle;animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  @media(max-width:980px){ .row{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="wrap app">
  <nav class="tabs" id="tabbar">
    <button class="tab" data-page="machine">Machine</button>
    <button class="tab" data-page="network">Network</button>
    <button class="tab" data-page="tuning">Tuning</button>
    <button class="tab" data-page="shaper">Input Shaper</button>
    <button class="tab" data-page="calibration">Calibration</button>
    <button class="tab" data-page="troubleshoot">Troubleshooting</button>
    <button class="tab" data-page="system">System</button>

    <span class="spacer"></span>
    <span class="divider" aria-hidden="true"></span>
    <!-- Default to localhost; JS will swap to LAN IP when possible -->
    <a id="dash-link" class="tab cta" href="http://localhost/" title="Open Dashboard">Printer Control ↗</a>
  </nav>

  <section class="pages">
    <div class="page-title" id="page-title">Machine</div>
    <div id="page" class="page-host"><!-- tab content mounts here --></div>
  </section>
</div>

<!-- Hidden target for any legacy forms if needed by tabs -->
<iframe name="hidden_iframe" style="display:none"></iframe>

<script>
/* ───────────────────────────────────────────────────────────────────────────
   Tiny Tab Loader
   - Loads tabs/<name>.html
   - Extracts <style>, inner HTML, and executes <script> tags
   - Cleans previous tab’s styles/scripts via data attributes
─────────────────────────────────────────────────────────────────────────── */

const TABS = ['machine','network','tuning','shaper','calibration','troubleshoot','system','updating','flash'];
const titleEl = document.getElementById('page-title');
const hostEl  = document.getElementById('page');
const tabbar  = document.getElementById('tabbar');
let currentTab = null;

function setActiveTab(name){
  document.querySelectorAll('.tab[data-page]').forEach(b=>{
    b.classList.toggle('active', b.dataset.page === name);
  });
  titleEl.textContent = prettyName(name);
}

function prettyName(pg){
  const m = {
    machine:'Machine', network:'Network', tuning:'Tuning',
    shaper:'Input Shaper', calibration:'Calibration',
    troubleshoot:'Troubleshooting', system:'System',
    updating:'System Update', flash:'Firmware Flash'
  };
  return m[pg] || (pg[0].toUpperCase()+pg.slice(1));
}

function cleanupTabArtifacts(){
  // remove any styles injected for previous tab
  document.querySelectorAll('style[data-tab-style]').forEach(n=>n.remove());
  // remove any script flags (no-op; scripts already executed)
  document.querySelectorAll('script[data-tab-script]').forEach(n=>n.remove());
}

// executes a <script> node by cloning to a real script so it runs
function runScriptNode(node, tabName){
  const s = document.createElement('script');
  // preserve type (supports module)
  if (node.type) s.type = node.type;
  // copy attributes except src to avoid double-loading unexpected
  for (const attr of node.attributes){
    if (attr.name === 'type') continue;
    if (attr.name === 'src'){
      // allow src usage if provided (absolute or relative to /tabs/)
      s.src = node.src || node.getAttribute('src');
      continue;
    }
    s.setAttribute(attr.name, attr.value);
  }
  s.setAttribute('data-tab-script', tabName);
  s.textContent = node.textContent ?? '';
  document.body.appendChild(s);
}

async function loadTab(name){
  if (!TABS.includes(name)) name = 'machine';
  if (currentTab === name) return;

  const url = `tabs/${name}.html?cachebust=${Date.now()}`;
  let text;
  try{
    const r = await fetch(url, {cache:'no-store'});
    if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
    text = await r.text();
  }catch(err){
    hostEl.innerHTML = `<div class="card"><div class="hint">Failed to load <span class="mono">${url}</span>: ${err}</div></div>`;
    setActiveTab(name);
    currentTab = name;
    return;
  }

  // parse
  const tmp = document.createElement('div');
  tmp.innerHTML = text;

  // clear previous
  cleanupTabArtifacts();
  hostEl.innerHTML = '';

  // mount styles (scoped by data attr so we can remove them later)
  tmp.querySelectorAll('style').forEach(st=>{
    const s = document.createElement('style');
    s.setAttribute('data-tab-style', name);
    s.textContent = st.textContent ?? '';
    document.head.appendChild(s);
    st.remove();
  });

  // move body content (anything not script after removing styles)
  // We’ll wrap remaining HTML in a container
  const mount = document.createElement('div');
  // anything that remains except script tags will be considered content
  // clone nodes while skipping <script>
  Array.from(tmp.childNodes).forEach(n=>{
    if (n.nodeType === 1 && n.tagName.toLowerCase() === 'script') return;
    mount.appendChild(n);
  });
  hostEl.appendChild(mount);

  // execute scripts sequentially
  tmp.querySelectorAll('script').forEach(sc=>runScriptNode(sc, name));

  // update UI
  setActiveTab(name);
  history.replaceState(null,'',`#${name}`);
  currentTab = name;
}

// nav binding
tabbar.querySelectorAll('.tab[data-page]').forEach(btn=>{
  btn.addEventListener('click', ()=>loadTab(btn.dataset.page));
});

// deep-link on load
loadTab((location.hash || '#machine').slice(1));

// back/forward support
window.addEventListener('hashchange', ()=>loadTab((location.hash||'#machine').slice(1)));

/* ── LAN IP-aware Dashboard link (global) ───────────────────────────────── */
(async () => {
  const dash=document.getElementById('dash-link');
  const currentHost=(location.host||'').split(':')[0];
  const reuse=h=>h && h!=='localhost' && h!=='127.0.0.1';
  let targetHost=currentHost;

  if (!reuse(currentHost)) {
    try {
      const r=await fetch('/cgi-bin/host_ip.sh',{cache:'no-store'});
      if (r.ok) {
        const t=(await r.text()).trim();
        if (/^\d+\.\d+\.\d+\.\d+$/.test(t)) targetHost=t;
      }
    } catch(e){}
  }
  if (dash) {
    dash.href=`http://${targetHost||'localhost'}/`;
    dash.title=`Open Dashboard on ${targetHost||'localhost'}`;
  }
})();

/* ── Background activity detector ───────────────────────────────────────
   Polls update.txt and flash_status to auto-switch view when activity
   is started from the OTHER client (touchscreen or computer).
   ────────────────────────────────────────────────────────────────────── */
(function(){
  let autoSwitchedToUpdate = false;

  async function checkActivity(){
    try {
      // --- OS update running? ---
      const ur = await fetch('/update.txt?ts='+Date.now(), {cache:'no-store'});
      if (ur.ok) {
        const ut = (await ur.text()).trim().toLowerCase();
        if ((ut === 'running' || ut === 'rebooting') && !autoSwitchedToUpdate) {
          autoSwitchedToUpdate = true;
          // loadTab is in the outer scope
          if (typeof loadTab === 'function' && currentTab !== 'updating') {
            loadTab('updating');
          }
        }
        // Reset flag when update finishes so it can trigger again next time
        if (ut !== 'running' && ut !== 'rebooting') {
          autoSwitchedToUpdate = false;
        }
      }
    } catch(e) { /* offline / rebooting — ignore */ }

    try {
      // --- Firmware flash running? ---
      const fr = await fetch('/cgi-bin/flash_status.sh?ts='+Date.now(), {cache:'no-store'});
      if (fr.ok) {
        const fj = await fr.json();
        const active = fj && fj.state
          && fj.state !== 'idle' && fj.state !== 'done' && fj.state !== 'error';
        if (active && currentTab !== 'flash') {
          loadTab('flash');
        }
      }
    } catch(e) { /* no flash in progress — normal */ }
  }

  setInterval(checkActivity, 4000);
})();
</script>
</body>
</html>
