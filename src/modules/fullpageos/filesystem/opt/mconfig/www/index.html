<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=1024, initial-scale=1"/>
<title>Machine Configurator (Modular Tabs)</title>

<!-- Kill caching while testing -->
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<style>
  /* ── Design Tokens ──────────────────────────────────────────────────────── */
  :root {
    /* Brand */
    --brand: #FFD400;
    --brand-600: #FFC800;
    --brand-700: #F0BD00;
    --brand-800: #E6B400;
    --brand-dim: rgba(255,212,0,.12);

    /* Surfaces — navy-dark but with enough lift to separate layers clearly */
    --bg:        #0E1014;
    --surface-0: #151719;
    --surface-1: #1C1F26;
    --surface-2: #232730;
    --surface-3: #2A2F3C;

    /* Borders — visible but not glaring */
    --border:   #2C3040;
    --border-2: #363C52;

    /* Text */
    --fg:    #EDF0F8;
    --muted: #8A919E;
    --dim:   #525866;

    /* Status */
    --success: #22c55e;  --success-bg: rgba(34,197,94,.1);   --success-border: rgba(34,197,94,.3);
    --warn:    #f97316;  --warn-bg:    rgba(249,115,22,.1);   --warn-border:    rgba(249,115,22,.3);
    --error:   #ef4444;  --error-bg:   rgba(239,68,68,.08);   --error-border:   rgba(239,68,68,.3);

    /* Geometry */
    --radius:    12px;
    --radius-sm: 8px;
    --radius-xs: 6px;
    --pad:       18px;

    /* Shadows */
    --shadow-sm: 0 1px 3px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.03);
    --shadow-md: 0 4px 16px rgba(0,0,0,.5);
    --shadow-lg: 0 12px 32px rgba(0,0,0,.7), 0 2px 8px rgba(0,0,0,.5);

    /* Focus */
    --focus-ring: 0 0 0 2.5px rgba(255,212,0,.45);

    /* Legacy aliases — used by tabs */
    --panel:       var(--surface-2);
    --panel-outer: var(--surface-1);
    --card-shadow: var(--shadow-sm);
    --white:      #FFFFFF;
    --black:      #000000;
    --near-black: #0E1014;
    --gray-050:   #EDF0F8;
    --gray-100:   #C8D0E4;
    --gray-200:   #A0ABCA;
    --gray-300:   #8A919E;
    --gray-400:   #636A7E;
    --gray-800:   #2A2F3C;
    --gray-850:   #232730;
    --gray-900:   #1C1F26;
    --gray-950:   #0E1014;
  }

  /* ── Reset / Base ────────────────────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box }
  html, body { height: 100%; margin: 0 }
  body {
    background: var(--bg);
    background-image: radial-gradient(ellipse 100% 40% at 50% 0%, rgba(255,212,0,.04) 0%, transparent 70%);
    color: var(--fg);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif;
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
  }
  [hidden] { display: none !important }

  /* ── Layout ──────────────────────────────────────────────────────────────── */
  .wrap {
    width: 100%;
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 16px 12px;
  }
  .app {
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
  }

  /* ── App top-bar (brand + nav + cta) ─────────────────────────────────────── */
  .app-topbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .app-brand {
    display: flex;
    align-items: center;
    flex-shrink: 0;
  }
  .brand-logo {
    height: 36px;
    width: auto;
  }
  .brand-sep { display: none }
  .brand-name { display: none }

  /* ── Navigation tabs ─────────────────────────────────────────────────────── */
  .tabs {
    display: flex;
    align-items: center;
    gap: 2px;
    flex: 1;
    padding: 3px;
    background: var(--surface-0);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scroll-behavior: smooth;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none }
  .tabs > * { flex-shrink: 0 }

  .tab {
    appearance: none;
    border: 1px solid transparent;
    background: transparent;
    color: var(--muted);
    padding: 7px 12px;
    border-radius: var(--radius-xs);
    cursor: pointer;
    user-select: none;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.1px;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    white-space: nowrap;
    transition: background .15s, color .15s, border-color .15s;
  }
  .tab:hover { background: var(--surface-2); color: var(--fg) }
  .tab:focus-visible { outline: none; box-shadow: inset var(--focus-ring) }
  .tab.active { background: var(--brand); color: #000; font-weight: 600; border-color: transparent }

  .tabs .spacer { flex: 1 }
  .tabs .divider { display: none }

  /* CTA — lives outside .tabs, always visible */
  .tab.cta {
    background: var(--brand);
    color: #000;
    font-size: 13px;
    font-weight: 700;
    padding: 8px 14px;
    border-radius: var(--radius-sm);
    border: none;
    flex-shrink: 0;
    letter-spacing: 0.1px;
    transition: background .15s, transform .1s;
  }
  .tab.cta:hover { background: var(--brand-600) }
  .tab.cta:active { background: var(--brand-700); transform: translateY(1px) }
  .tab.cta:focus-visible { outline: none; box-shadow: var(--focus-ring) }

  /* ── Content area ────────────────────────────────────────────────────────── */
  .pages {
    flex: 1;
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    margin-top: 8px;
    display: grid;
    grid-template-rows: auto 1fr;
    align-content: start;
    overflow-y: auto;
  }
  .page-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--fg);
    display: flex;
    align-items: center;
    gap: 10px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 12px;
    letter-spacing: -0.1px;
  }
  .page-title::before {
    content: '';
    width: 3px;
    height: 17px;
    background: var(--brand);
    border-radius: 2px;
    flex-shrink: 0;
  }
  .page-host { margin-top: 0 }

  /* ── Shared global utilities ─────────────────────────────────────────────── */
  .card {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface-2);
    padding: 14px;
    box-shadow: var(--shadow-sm);
  }
  .row { display: grid; gap: 12px; grid-template-columns: 1fr 1fr }
  @media (max-width: 980px) { .row { grid-template-columns: 1fr } }

  label {
    display: block;
    color: var(--muted);
    font-size: 11.5px;
    font-weight: 500;
    margin-bottom: 5px;
    letter-spacing: 0.25px;
  }
  input, select {
    width: 100%;
    padding: 9px 12px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-2);
    background: var(--surface-0);
    color: var(--fg);
    font-size: 13px;
    font-family: inherit;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input::placeholder { color: var(--dim) }
  input:hover, select:hover { border-color: var(--muted) }
  input:focus, select:focus,
  input:focus-visible, select:focus-visible {
    border-color: var(--brand-700);
    box-shadow: var(--focus-ring);
    outline: none;
  }
  button {
    border: none;
    padding: 9px 16px;
    border-radius: var(--radius-sm);
    background: var(--brand);
    color: #000;
    font-size: 13px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    letter-spacing: 0.1px;
    transition: background .15s, transform .1s;
    white-space: nowrap;
  }
  button:hover { background: var(--brand-600) }
  button:active { background: var(--brand-700); transform: translateY(1px) }
  button:focus-visible { outline: none; box-shadow: var(--focus-ring) }
  button:disabled { opacity: .35; cursor: not-allowed; transform: none; pointer-events: none }

  .btn-ghost {
    background: var(--surface-3);
    color: var(--fg);
    border: 1px solid var(--border-2);
    box-shadow: none;
  }
  .btn-ghost:hover { background: var(--surface-3); filter: brightness(1.25) }
  .btn-ghost:active { transform: translateY(1px) }

  .btn-row { display: flex; align-items: center; justify-content: flex-end; gap: 8px }
  .hint { color: var(--muted); font-size: 12px; line-height: 1.55 }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace }

  .spinner {
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,.08);
    border-top-color: var(--brand);
    border-radius: 50%;
    display: inline-block;
    vertical-align: middle;
    animation: spin .85s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg) } }
</style>
</head>
<body>
<div class="wrap app">
  <div class="app-topbar">
    <div class="app-brand">
      <img src="/img/re3d-logo.png" alt="re3D" class="brand-logo">
      <span class="brand-sep" aria-hidden="true"></span>
      <span class="brand-name">Configurator</span>
    </div>
    <nav class="tabs" id="tabbar">
      <button class="tab" data-page="machine">Machine</button>
      <button class="tab" data-page="network">Network</button>
      <button class="tab" data-page="tuning">Tuning</button>
      <button class="tab" data-page="shaper">Input Shaper</button>
      <button class="tab" data-page="calibration">Calibration</button>
      <button class="tab" data-page="troubleshoot">Troubleshooting</button>
      <button class="tab" data-page="system">System</button>
      <span class="spacer"></span>
    </nav>
    <!-- Default to localhost; JS will swap to LAN IP when possible -->
    <a id="dash-link" class="tab cta" href="http://localhost/" title="Open Dashboard">Printer Control ↗</a>
  </div>

  <section class="pages">
    <div class="page-title" id="page-title">Machine</div>
    <div id="page" class="page-host"><!-- tab content mounts here --></div>
  </section>
</div>

<!-- Hidden target for any legacy forms if needed by tabs -->
<iframe name="hidden_iframe" style="display:none"></iframe>

<script>
/* ───────────────────────────────────────────────────────────────────────────
   Tiny Tab Loader
   - Loads tabs/<name>.html
   - Extracts <style>, inner HTML, and executes <script> tags
   - Cleans previous tab’s styles/scripts via data attributes
─────────────────────────────────────────────────────────────────────────── */

const TABS = ['machine','network','tuning','shaper','calibration','troubleshoot','system'];
const titleEl = document.getElementById('page-title');
const hostEl  = document.getElementById('page');
const tabbar  = document.getElementById('tabbar');
let currentTab = null;

function setActiveTab(name){
  document.querySelectorAll('.tab[data-page]').forEach(b=>{
    b.classList.toggle('active', b.dataset.page === name);
  });
  titleEl.textContent = prettyName(name);
}

function prettyName(pg){
  const m = {
    machine:'Machine', network:'Network', tuning:'Tuning',
    shaper:'Input Shaper', calibration:'Calibration',
    troubleshoot:'Troubleshooting', system:'System'
  };
  return m[pg] || (pg[0].toUpperCase()+pg.slice(1));
}

function cleanupTabArtifacts(){
  // remove any styles injected for previous tab
  document.querySelectorAll('style[data-tab-style]').forEach(n=>n.remove());
  // remove any script flags (no-op; scripts already executed)
  document.querySelectorAll('script[data-tab-script]').forEach(n=>n.remove());
}

// executes a <script> node by cloning to a real script so it runs
function runScriptNode(node, tabName){
  const s = document.createElement('script');
  // preserve type (supports module)
  if (node.type) s.type = node.type;
  // copy attributes except src to avoid double-loading unexpected
  for (const attr of node.attributes){
    if (attr.name === 'type') continue;
    if (attr.name === 'src'){
      // allow src usage if provided (absolute or relative to /tabs/)
      s.src = node.src || node.getAttribute('src');
      continue;
    }
    s.setAttribute(attr.name, attr.value);
  }
  s.setAttribute('data-tab-script', tabName);
  s.textContent = node.textContent ?? '';
  document.body.appendChild(s);
}

async function loadTab(name){
  if (!TABS.includes(name)) name = 'machine';
  if (currentTab === name) return;

  const url = `tabs/${name}.html?cachebust=${Date.now()}`;
  let text;
  try{
    const r = await fetch(url, {cache:'no-store'});
    if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
    text = await r.text();
  }catch(err){
    hostEl.innerHTML = `<div class="card"><div class="hint">Failed to load <span class="mono">${url}</span>: ${err}</div></div>`;
    setActiveTab(name);
    currentTab = name;
    return;
  }

  // parse
  const tmp = document.createElement('div');
  tmp.innerHTML = text;

  // clear previous
  cleanupTabArtifacts();
  hostEl.innerHTML = '';

  // mount styles (scoped by data attr so we can remove them later)
  tmp.querySelectorAll('style').forEach(st=>{
    const s = document.createElement('style');
    s.setAttribute('data-tab-style', name);
    s.textContent = st.textContent ?? '';
    document.head.appendChild(s);
    st.remove();
  });

  // move body content (anything not script after removing styles)
  // We’ll wrap remaining HTML in a container
  const mount = document.createElement('div');
  // anything that remains except script tags will be considered content
  // clone nodes while skipping <script>
  Array.from(tmp.childNodes).forEach(n=>{
    if (n.nodeType === 1 && n.tagName.toLowerCase() === 'script') return;
    mount.appendChild(n);
  });
  hostEl.appendChild(mount);

  // execute scripts sequentially
  tmp.querySelectorAll('script').forEach(sc=>runScriptNode(sc, name));

  // update UI
  setActiveTab(name);
  history.replaceState(null,'',`#${name}`);
  currentTab = name;
}

// nav binding
tabbar.querySelectorAll('.tab[data-page]').forEach(btn=>{
  btn.addEventListener('click', ()=>loadTab(btn.dataset.page));
});

// deep-link on load
loadTab((location.hash || '#machine').slice(1));

// back/forward support
window.addEventListener('hashchange', ()=>loadTab((location.hash||'#machine').slice(1)));

/* ── LAN IP-aware Dashboard link (global) ───────────────────────────────── */
(async () => {
  const dash=document.getElementById('dash-link');
  const currentHost=(location.host||'').split(':')[0];
  const reuse=h=>h && h!=='localhost' && h!=='127.0.0.1';
  let targetHost=currentHost;

  if (!reuse(currentHost)) {
    try {
      const r=await fetch('/cgi-bin/host_ip.sh',{cache:'no-store'});
      if (r.ok) {
        const t=(await r.text()).trim();
        if (/^\d+\.\d+\.\d+\.\d+$/.test(t)) targetHost=t;
      }
    } catch(e){}
  }
  if (dash) {
    dash.href=`http://${targetHost||'localhost'}/`;
    dash.title=`Open Dashboard on ${targetHost||'localhost'}`;
  }
})();
</script>
</body>
</html>
