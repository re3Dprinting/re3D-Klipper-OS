<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Calibration Prints — Pressure Advance</title>
<style>
  :root{ --bg:#0f1013; --panel:#15171b; --muted:#9aa3b2; --fg:#e9eef5; --brand:#FFD400; --border:#262a31; --gray-200:#D9D9D9; }
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  .page{max-width:900px;margin:24px auto;padding:0 14px}
  h1{margin:0 0 12px 0;font-size:20px}
  .content{display:grid;gap:12px}
  .card{background:var(--panel);border:1px dashed var(--border);border-radius:12px;padding:12px;display:grid;gap:12px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:900px){ .row{grid-template-columns:1fr} }
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
  input,select,button{font:inherit;color:var(--fg);background:#0C0E12;border:1px solid var(--border);border-radius:10px;padding:8px 10px;outline:none}
  input::placeholder{color:#7b8494}
  .btn-row{display:flex;gap:8px}
  button{cursor:pointer}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
  .out{margin-top:4px;padding:8px 10px;border-radius:10px;background:#0C0E12;border:1px dashed var(--border);max-height:200px;overflow:auto;font-size:12px;color:var(--gray-200)}
  .radio-group{display:flex;gap:10px;align-items:center}
  .radio-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--border);border-radius:999px;background:#0C0E12}
  .radio-chip input{accent-color:var(--brand)}
</style>
</head>
<body>
  <div class="page">
    <h1>Calibration Prints</h1>

    <div class="content">
      <!-- Pressure Advance -->
      <form class="card" action="/cgi-bin/print_pressure_advance.sh" method="post" id="cal-pa-form">
        <div style="font-weight:800;margin-bottom:2px">Pressure Advance</div>

        <div class="row">
          <div>
            <label for="pa-hotend">Hotend Temp (°C)</label>
            <input id="pa-hotend" name="hotend_temp" type="number" step="0.1" min="0" max="330" value="220" required>
          </div>
          <div>
            <label for="pa-bed">Bed Temp (°C)</label>
            <input id="pa-bed" name="bed_temp" type="number" step="0.1" min="0" max="150" value="60" required>
          </div>
        </div>

        <div class="row">
          <div>
            <label for="pa-machine">Machine Type</label>
            <select id="pa-machine" name="machine" required>
              <option value="" disabled selected>Select machine</option>
              <option>Gigabot 4</option>
              <option>Gigabot 4 XLT</option>
              <option>Terabot 4</option>
            </select>
          </div>

          <div>
            <label>Extruder</label>
            <div class="radio-group" role="radiogroup" aria-label="Extruder">
              <label class="radio-chip"><input type="radio" name="extruder" value="left" required>Left</label>
              <label class="radio-chip"><input type="radio" name="extruder" value="right">Right</label>
            </div>
          </div>
        </div>

        <div class="btn-row">
          <button type="submit">Generate PA G-code</button>
        </div>

        <div class="out mono" id="out-cal-pa">Awaiting input…</div>
      </form>
    </div>
  </div>

<script>
(() => {
  const ENABLED = true; // per your request: active

  // Submit via AJAX and show the CGI response
  const f = document.getElementById('cal-pa-form');
  const out = document.getElementById('out-cal-pa');

  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    out.textContent = 'Generating file…';
    try{
      const fd = new FormData(f);
      const resp = await fetch(f.action, {
        method: 'POST',
        headers: {'Content-Type':'application/x-www-form-urlencoded'},
        body: new URLSearchParams(fd)
      });
      const text = await resp.text();
      out.textContent = text.trim() || 'Done.';
    }catch(err){
      out.textContent = `Error: ${err}`;
    }
  });
})();
</script>
</body>
</html>
