<style>
  .out{
    margin-top:4px;padding:8px 10px;border-radius:10px;background:#0C0E12;
    border:1px dashed var(--border);max-height:200px;overflow:auto;font-size:12px;color:var(--gray-200)
  }
  .btn-row{display:flex;align-items:center;gap:8px}
</style>

<div class="content single">
  <div class="card">
    <div style="font-weight:800;margin-bottom:6px">Log collection</div>
      <p class="hint">Collects printer logs, Chromium logs, dmesg, journalctl and systemctl output.</p>
    <div class="btn-row" style="margin-bottom:8px">
    <form id="logs-download-form" action="/cgi-bin/collect_logs.sh" method="get" target="_self">
      <button type="submit">Download log bundle</button>
    </form>
    <form id="logs-usb-form" action="/cgi-bin/collect_logs.sh" method="get">
      <input type="hidden" name="dest" value="usb">
      <button type="submit" id="logs-usb-btn">Save to USB</button>
      <span id="logs-spinner" class="spinner" style="display:none;margin-left:8px" aria-hidden="true"></span>
    </form>
    <form id="logs-parse-form">
      <button type="submit" id="logs-parse-btn">Scan log for errors</button>
    </form>
  </div>
  <div class="out mono" id="out-logs"></div>
    <p class="hint">Insert a USB drive before clicking "Save to USB".</p>
  </div>
</div>

<script>
(() => {
  const out       = document.getElementById('out-logs');

  const usbForm   = document.getElementById('logs-usb-form');
  const usbBtn    = document.getElementById('logs-usb-btn');
  const spinner   = document.getElementById('logs-spinner');

  const parseForm = document.getElementById('logs-parse-form');
  const parseBtn  = document.getElementById('logs-parse-btn');

  if (usbForm && out) {
    usbForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (usbBtn) { usbBtn.disabled = true; usbBtn.setAttribute('aria-busy', 'true'); }
      if (spinner) spinner.style.display = 'inline-block';
      out.textContent = 'Saving to USB...';
      try {
        const resp = await fetch('/cgi-bin/collect_logs.sh?dest=usb', { method: 'GET' });
        const text = await resp.text();
        out.textContent = text.trim() || 'Done.';
      } catch (err) {
        out.textContent = 'Error: ' + err;
      } finally {
        if (usbBtn) { usbBtn.disabled = false; usbBtn.removeAttribute('aria-busy'); }
        if (spinner) spinner.style.display = 'none';
      }
    });
  }

  if (parseForm && out) {
    parseForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (parseBtn) { parseBtn.disabled = true; parseBtn.setAttribute('aria-busy', 'true'); }
      out.textContent = 'Collecting logs and scanning for errors...';
      try {
        const resp = await fetch('/cgi-bin/parse_log.sh', { method: 'GET' });
        const text = await resp.text();
        out.textContent = text.trim() || 'No output.';
      } catch (err) {
        out.textContent = 'Error: ' + err;
      } finally {
        if (parseBtn) { parseBtn.disabled = false; parseBtn.removeAttribute('aria-busy'); }
      }
    });
  }
})();
</script>
