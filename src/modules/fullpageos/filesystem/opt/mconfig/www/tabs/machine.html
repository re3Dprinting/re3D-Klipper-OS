<!-- Machine tab: self-contained HTML + CSS + JS -->
<style>
  .machine-grid{display:grid;gap:8px;grid-template-columns:repeat(3,1fr)}
  .machine-card{
    position:relative;border:2px solid transparent;border-radius:var(--radius);background:var(--surface-2);
    overflow:hidden;cursor:pointer;user-select:none;display:grid;grid-template-rows:1fr auto;
    transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease, background .15s ease;
    box-shadow:var(--shadow-sm);
  }
  .machine-card:hover{transform:translateY(-2px);background:var(--surface-3);box-shadow:var(--shadow-md)}

  .machine-card:has(input[type="radio"]:checked),
  .machine-card.selected{
    border-color:var(--brand-700);
    box-shadow:0 0 0 2px rgba(255,212,0,.3), var(--shadow-md);
  }

  .machine-card img{display:block;width:100%;height:100px;object-fit:cover;background:var(--surface-0)}
  .machine-card .title{
    padding:7px 10px;font-weight:700;font-size:12px;text-align:center;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg)
  }

  .machine-card input[type=radio]{
    position:absolute;inset:0;opacity:0;
  }

  .out{
    margin-top:6px;padding:10px 12px;border-radius:var(--radius-sm);background:var(--surface-1);
    border:1px solid var(--border);max-height:160px;overflow:auto;font-size:12px;color:var(--gray-200)
  }

  /* Modal */
  .modal-wrap{
    position:fixed;inset:0;display:grid;place-items:center;
    background:rgba(0,0,0,.6);backdrop-filter:saturate(.8) blur(4px);z-index:999;
  }
  .modal{
    width:min(520px,calc(100vw - 32px));
    background:var(--surface-1);
    border:1px solid var(--border-2);
    border-radius:var(--radius);
    box-shadow:var(--shadow-lg);
    display:grid;gap:12px;padding:20px;
  }
  .modal h3{margin:0;font-size:16px;font-weight:800;color:var(--fg);}
  .modal p{margin:0;color:var(--muted);font-size:13px;line-height:1.5;}
  .modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:4px;}
  .btn-ghost{background:var(--surface-3);color:var(--fg);border:1px solid var(--border-2);box-shadow:none}
  .btn-ghost:hover{filter:brightness(1.25)}

  /* Machine option toggles */
  .opt-section{
    border-top:1px solid var(--border);margin-top:12px;padding-top:10px;
    display:grid;gap:6px;
  }
  .opt-section-title{font-weight:700;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
  .opt-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:6px 10px;border-radius:var(--radius-sm);
    background:var(--surface-2);border:1px solid var(--border);
  }
  .opt-label{font-size:13px;font-weight:600;color:var(--fg)}
  .opt-desc{font-size:11px;color:var(--muted);margin-top:1px}
  /* Toggle switch */
  .tog{position:relative;display:inline-block;width:38px;height:22px;flex-shrink:0}
  .tog input{opacity:0;width:0;height:0;position:absolute}
  .tog-track{
    position:absolute;inset:0;background:var(--surface-3);
    border:1px solid var(--border);border-radius:11px;cursor:pointer;
    transition:background .18s,border-color .18s;
  }
  .tog input:checked ~ .tog-track{background:var(--brand-700);border-color:var(--brand-700)}
  .tog-track::after{
    content:'';position:absolute;left:3px;top:3px;
    width:14px;height:14px;background:#fff;border-radius:50%;
    transition:transform .18s;box-shadow:0 1px 3px rgba(0,0,0,.25);
  }
  .tog input:checked ~ .tog-track::after{transform:translateX(16px)}
</style>

<div class="content single">
  <form class="card" action="/cgi-bin/set_machine_type.sh" method="post" id="form-machine">
    <div style="font-weight:800;margin-bottom:6px">Select your machine</div>
    <input type="hidden" name="type" id="machine-type-hidden" value="Gigabot 4">
    <div class="machine-grid" id="machine-grid">
      <label class="machine-card" data-type="Gigabot 4">
        <input type="radio" name="type-radio" value="Gigabot 4">
        <img src="/img/gigabot-4.png" alt="Gigabot 4">
        <div class="title">Gigabot 4</div>
      </label>
      <label class="machine-card" data-type="Gigabot 4 XLT">
        <input type="radio" name="type-radio" value="Gigabot 4 XLT">
        <img src="/img/gigabot-4-xlt.png" alt="Gigabot 4 XLT">
        <div class="title">Gigabot 4 XLT</div>
      </label>
      <label class="machine-card" data-type="Terabot 4">
        <input type="radio" name="type-radio" value="Terabot 4">
        <img src="/img/terabot-4.png" alt="Terabot 4">
        <div class="title">Terabot 4</div>
      </label>
      <label class="machine-card" data-type="GigabotX 2">
        <input type="radio" name="type-radio" value="GigabotX 2">
        <img src="/img/gigabotx-2.png" alt="GigabotX 2">
        <div class="title">GigabotX 2</div>
      </label>
      <label class="machine-card" data-type="GigabotX XLT 2">
        <input type="radio" name="type-radio" value="GigabotX XLT 2">
        <img src="/img/gigabotx-2-xlt.png" alt="GigabotX XLT 2">
        <div class="title">GigabotX XLT 2</div>
      </label>
      <label class="machine-card" data-type="TerabotX 2">
        <input type="radio" name="type-radio" value="TerabotX 2">
        <img src="/img/terabotx-2.png" alt="TerabotX 2">
        <div class="title">TerabotX 2</div>
      </label>
    </div>
    <!-- Additional options (shown only for machines that support them) -->
    <div id="machine-options" hidden>
      <div class="opt-section">
        <div class="opt-section-title">Additional Options</div>

        <!-- Mesh compensation: Gigabot 4 / Gigabot 4 XLT only -->
        <div id="opt-mesh" class="opt-row" hidden>
          <div>
            <div class="opt-label">Mesh Compensation</div>
            <div class="opt-desc">Enable automatic bed-mesh levelling</div>
          </div>
          <label class="tog" aria-label="Mesh Compensation">
            <input type="checkbox" id="chk-mesh">
            <span class="tog-track"></span>
          </label>
        </div>

        <!-- Crammer: X-line printers only -->
        <div id="opt-crammer" class="opt-row" hidden>
          <div>
            <div class="opt-label">Crammer</div>
            <div class="opt-desc">Enable crammer extruder support</div>
          </div>
          <label class="tog" aria-label="Crammer">
            <input type="checkbox" id="chk-crammer">
            <span class="tog-track"></span>
          </label>
        </div>

        <!-- Heater Pad: X-line printers only -->
        <div id="opt-heater" class="opt-row" hidden>
          <div>
            <div class="opt-label">Heater Pad</div>
            <div class="opt-desc">Enable heated bed pad</div>
          </div>
          <label class="tog" aria-label="Heater Pad">
            <input type="checkbox" id="chk-heater">
            <span class="tog-track"></span>
          </label>
        </div>
      </div>
    </div>

    <div class="btn-row" style="justify-content:flex-end;margin-top:10px">
      <button type="submit">Set Machine</button>
    </div>
    <div class="out mono" id="out-machine"></div>
  </form>
</div>

<!-- Reboot Required Modal -->
<div class="modal-wrap" id="reboot-modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="reboot-title">
    <h3 id="reboot-title">Reboot required</h3>
    <p>Machine type was updated. A reboot is required for changes to take effect.</p>
    <div class="actions">
      <button class="btn-ghost" id="reboot-cancel" type="button">Cancel</button>
      <button id="reboot-now" type="button">Reboot now</button>
    </div>
    <div class="hint mono" id="reboot-status"></div>
  </div>
</div>

<script>
(() => {
  const cards = Array.from(document.querySelectorAll('.machine-card'));
  const radios = Array.from(document.querySelectorAll('input[name="type-radio"]'));
  const hidden = document.getElementById('machine-type-hidden');

  // Which options each machine exposes
  const MACHINE_OPTS = {
    'Gigabot 4':      ['mesh'],
    'Gigabot 4 XLT':  ['mesh'],
    'Terabot 4':      [],
    'GigabotX 2':     ['crammer', 'heater'],
    'GigabotX XLT 2': ['crammer', 'heater'],
    'TerabotX 2':     ['crammer', 'heater'],
  };
  const OPT_IDS = { mesh: 'opt-mesh', crammer: 'opt-crammer', heater: 'opt-heater' };
  const optSection = document.getElementById('machine-options');

  function updateOptionsVisibility(machineType) {
    const allowed = MACHINE_OPTS[machineType] || [];
    Object.entries(OPT_IDS).forEach(([key, id]) => {
      const el = document.getElementById(id);
      if (el) el.hidden = !allowed.includes(key);
    });
    optSection.hidden = allowed.length === 0;
  }

  // JS fallback selection so it works even without :has()
  function applySelectedClasses(){
    cards.forEach(card => card.classList.remove('selected'));
    const checked = radios.find(r => r.checked);
    if (checked){
      const card = checked.closest('.machine-card');
      card && card.classList.add('selected');
      if (hidden) hidden.value = checked.value;
      updateOptionsVisibility(checked.value);
    }
  }

  // Fetch current machine type and options from server, then pre-select
  (async () => {
    try {
      const [typeResp, optsResp] = await Promise.all([
        fetch('/cgi-bin/get_machine_type.sh'),
        fetch('/cgi-bin/get_machine_options.sh'),
      ]);
      if (typeResp.ok) {
        const current = (await typeResp.text()).trim();
        const match = radios.find(r => r.value === current);
        if (match) match.checked = true;
      }
      if (optsResp.ok) {
        const opts = await optsResp.json();
        const chkMesh    = document.getElementById('chk-mesh');
        const chkCrammer = document.getElementById('chk-crammer');
        const chkHeater  = document.getElementById('chk-heater');
        if (chkMesh)    chkMesh.checked    = !!opts.mesh_compensation;
        if (chkCrammer) chkCrammer.checked = !!opts.crammer;
        if (chkHeater)  chkHeater.checked  = !!opts.heater_bed;
      }
    } catch (_) { /* fall through to defaults */ }
    // If nothing was selected (fetch failed or unknown), default to first
    if (!radios.some(r => r.checked) && radios.length) radios[0].checked = true;
    applySelectedClasses();
  })();

  // Click anywhere on a card to select its radio
  cards.forEach(card => {
    card.addEventListener('click', (e) => {
      const r = card.querySelector('input[type="radio"]');
      if (r && !r.checked){
        r.checked = true;      // ensure checked state flips
        r.dispatchEvent(new Event('change', {bubbles:true}));
      }
    });
  });

  // Keep hidden input and options visibility synced on change
  radios.forEach(r=>{
    r.addEventListener('change', () => {
      applySelectedClasses();
    });
  });

  // Modal helpers
  const modal = document.getElementById('reboot-modal');
  const rebootNowBtn = document.getElementById('reboot-now');
  const rebootCancelBtn = document.getElementById('reboot-cancel');
  const rebootStatus = document.getElementById('reboot-status');

  function openRebootModal(){
    modal.hidden = false;
    rebootStatus.textContent = '';
    rebootNowBtn.focus();
    document.addEventListener('keydown',escCloser);
  }
  function closeRebootModal(){
    modal.hidden = true;
    document.removeEventListener('keydown',escCloser);
  }
  function escCloser(e){ if(e.key === 'Escape'){ closeRebootModal(); } }
  rebootCancelBtn.addEventListener('click', closeRebootModal);
  modal.addEventListener('click', (e)=>{ if (e.target === modal) closeRebootModal(); });

  rebootNowBtn.addEventListener('click', async ()=>{
    rebootNowBtn.disabled = true;
    rebootCancelBtn.disabled = true;
    rebootStatus.textContent = 'Rebooting…';
    try{
      const r = await fetch('/cgi-bin/reboot.sh', { method:'POST' });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      rebootStatus.textContent = 'Reboot command sent.';
    }catch(err){
      rebootStatus.textContent = `Failed to reboot: ${err}`;
      rebootNowBtn.disabled = false;
      rebootCancelBtn.disabled = false;
    }
  });

  // AJAX submit
  const form=document.getElementById('form-machine');
  const out=document.getElementById('out-machine');
  if(form && out){
    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      out.textContent='Applying…';
      try{
        // Build params manually so unchecked booleans are still sent as 'false'
        const params = new URLSearchParams();
        params.set('type', hidden.value);
        params.set('mesh_compensation', document.getElementById('chk-mesh')?.checked    ? 'true' : 'false');
        params.set('crammer',           document.getElementById('chk-crammer')?.checked ? 'true' : 'false');
        params.set('heater_bed',        document.getElementById('chk-heater')?.checked  ? 'true' : 'false');
        const resp=await fetch('/cgi-bin/set_machine_type.sh',{
          method:'POST',
          headers:{'Content-Type':'application/x-www-form-urlencoded'},
          body:params
        });
        const text=await resp.text();
        out.textContent=text.trim()||'Updated.';
        if (resp.ok) openRebootModal();
      }catch(err){ out.textContent=`Error: ${err}`; }
    });
  }
})();
</script>
