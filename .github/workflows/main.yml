name: Build Image

on: push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CACHE_VER: v1
      CACHE_NS: main
    steps:
      # 0) free space first
      - name: Free space early
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache || true
          sudo docker image prune -af || true
          df -h

      - name: Update apt
        run: sudo apt-get update

      - name: Install Dependencies
        run: sudo apt-get install -y coreutils p7zip-full qemu-user-static python3-git rsync

      - name: Checkout CustomPiOS
        uses: actions/checkout@v4
        with:
          repository: "guysoft/CustomPiOS"
          path: CustomPiOS

      - name: Checkout Project Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          path: repository
          submodules: true

      # compute cache keys from start_chroot_script
      - name: Compute cache keys
        id: keys
        run: |
          FILE=repository/src/modules/fullpageos/start_chroot_script
          H=$( [ -f "$FILE" ] && sha256sum "$FILE" | cut -d' ' -f1 || echo none )

          echo "KLIPPER_KEY=${{ runner.os }}-${{ env.CACHE_VER }}-klipper-${H}-${{ env.CACHE_NS }}" >> $GITHUB_OUTPUT
          echo "MOONRAKER_KEY=${{ runner.os }}-${{ env.CACHE_VER }}-moonraker-${H}-${{ env.CACHE_NS }}" >> $GITHUB_OUTPUT
          echo "CROWSNEST_KEY=${{ runner.os }}-${{ env.CACHE_VER }}-crowsnest-${H}-${{ env.CACHE_NS }}" >> $GITHUB_OUTPUT
          echo "CROWSNEST_BIN_KEY=${{ runner.os }}-${{ env.CACHE_VER }}-crowsnest-binaries-${H}-${{ env.CACHE_NS }}" >> $GITHUB_OUTPUT

      # grab base image
      - name: Download Raspbian Image
        run: |
          cd repository/src/image
          wget -q -c --trust-server-names \
            'https://downloads.raspberrypi.com/raspios_lite_arm64/images/raspios_lite_arm64-2025-12-04/2025-12-04-raspios-trixie-arm64-lite.img.xz'

      - name: Update CustomPiOS Paths
        run: cd repository/src && ../../CustomPiOS/src/update-custompios-paths

      # restore caches (host machine $HOME)
      - id: klipper-restore
        uses: actions/cache@v4
        with:
          path: |
            ~/klipper
          key: ${{ steps.keys.outputs.KLIPPER_KEY }}
          restore-keys: |
            ${{ runner.os }}-${{ env.CACHE_VER }}-klipper-
            ${{ runner.os }}-klipper-

      - id: moonraker-restore
        uses: actions/cache@v4
        with:
          path: |
            ~/moonraker
          key: ${{ steps.keys.outputs.MOONRAKER_KEY }}
          restore-keys: |
            ${{ runner.os }}-${{ env.CACHE_VER }}-moonraker-
            ${{ runner.os }}-moonraker-

      - id: crowsnest-restore
        uses: actions/cache@v4
        with:
          path: |
            ~/crowsnest
          key: ${{ steps.keys.outputs.CROWSNEST_KEY }}
          restore-keys: |
            ${{ runner.os }}-${{ env.CACHE_VER }}-crowsnest-
            ${{ runner.os }}-crowsnest-

      - id: crowsnest-bin-restore
        uses: actions/cache@v4
        with:
          path: ~/crowsnest-binaries
          key: ${{ steps.keys.outputs.CROWSNEST_BIN_KEY }}
          restore-keys: |
            ${{ runner.os }}-${{ env.CACHE_VER }}-crowsnest-binaries-
            ${{ runner.os }}-crowsnest-binaries-

      # stage caches into filesystem/host_cache (but exclude huge venvs)
      - name: Stage caches (incl. Crowsnest binaries) into host_cache
        run: |
          set -euxo pipefail
          DEST="repository/src/modules/fullpageos/filesystem/host_cache"
          rm -rf "$DEST"; mkdir -p "$DEST"

          # these repos might have venvs, skip those
          for d in klipper moonraker crowsnest; do
            SRC="$HOME/$d"
            if [ -d "$SRC" ]; then
              mkdir -p "$DEST/$d"
              rsync -a --delete \
                --exclude 'klippy-env' \
                --exclude 'moonraker-env' \
                --exclude 'venv' \
                "$SRC/" "$DEST/$d/"
            fi
          done

          if [ -d "$HOME/crowsnest-binaries" ]; then
            mkdir -p "$DEST/crowsnest-binaries"
            rsync -a --delete "$HOME/crowsnest-binaries/" "$DEST/crowsnest-binaries/"
          fi

      - name: Build Image
        run: |
          sudo modprobe loop
          cd repository/src
          sudo bash -x ./build_dist


      - name: copy Output
        run: |
          cp ${{ github.workspace }}/repository/src/workspace/*-raspios-*-lite.img build.img

      - name: Debug image file before mounting
        run: |
          IMAGE_FILE=build.img
          echo "Image file: $IMAGE_FILE"
          echo "=== file output ==="
          file "$IMAGE_FILE"
          echo "=== fdisk output ==="
          sudo fdisk -l "$IMAGE_FILE" || true
          echo "=== parted output ==="
          sudo parted "$IMAGE_FILE" print || true

      # mount built image read-only, copy back ONLY repos + small binaries
      - name: Extract build outputs from image for caching
        shell: bash
        run: |
          set -euxo pipefail
          sudo umount -R extracted 2>/dev/null || true
          sudo losetup -D 2>/dev/null || true
          mkdir -p extracted
          IMAGE_FILE="build.img"
          LOOPDEV="$(sudo losetup -fP --show "$IMAGE_FILE")"
          cleanup() {
            set +e
            sudo umount -R extracted 2>/dev/null || true
            sudo losetup -d "$LOOPDEV" 2>/dev/null || true
          }
          trap cleanup EXIT
          ROOT_PART="${LOOPDEV}p2"
          sudo mount -o ro "$ROOT_PART" extracted || true

          # for each repo, nuke the old one first so we don't get klipper/klipper/...
          for d in klipper moonraker crowsnest; do
            SRC="extracted/home/pi/$d"
            if [ -d "$SRC/.git" ]; then
              sudo rm -rf "$HOME/$d/"
              sudo mkdir -p "$HOME/$d/"
              sudo rsync -a --delete \
                --exclude 'klippy-env' \
                --exclude 'moonraker-env' \
                --exclude 'venv' \
                "$SRC/" "$HOME/$d/"
              sudo chown -R runner:docker "$HOME/$d"
            fi
          done

          # small binaries
          sudo mkdir -p "$HOME/crowsnest-binaries"
          sudo cp -f extracted/usr/local/bin/ustreamer       "$HOME/crowsnest-binaries/ustreamer"       2>/dev/null || true
          sudo cp -f extracted/usr/local/bin/camera-streamer "$HOME/crowsnest-binaries/camera-streamer" 2>/dev/null || true
          sudo cp -f extracted/usr/local/bin/crowsnest       "$HOME/crowsnest-binaries/crowsnest"       2>/dev/null || true
          sudo cp -f extracted/lib/systemd/system/crowsnest.service "$HOME/crowsnest-binaries/crowsnest.service" 2>/dev/null || true
          sudo cp -f extracted/etc/systemd/system/crowsnest.service "$HOME/crowsnest-binaries/crowsnest.service" 2>/dev/null || true
          sudo chown -R runner:docker "$HOME/crowsnest-binaries" || true
          
      # free space BEFORE caches are saved
      - name: Free space before caching
        run: |
          set -euxo pipefail
          for d in klipper moonraker crowsnest; do
            if [ -d "$HOME/$d/.git" ]; then
              git -C "$HOME/$d" gc --prune=now --aggressive || true
              git -C "$HOME/$d" repack -a -d --depth=1 --window=1 || true
            fi
          done
          sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/*.deb || true
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache || true
          df -h

      # save caches back (only if we didn't have them)
      - name: Save Klipper cache
        if: steps.klipper-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/klipper
          key: ${{ steps.keys.outputs.KLIPPER_KEY }}

      - name: Save Moonraker cache
        if: steps.moonraker-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/moonraker
          key: ${{ steps.keys.outputs.MOONRAKER_KEY }}

      - name: Save Crowsnest cache
        if: steps.crowsnest-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/crowsnest
          key: ${{ steps.keys.outputs.CROWSNEST_KEY }}

      - name: Save Crowsnest binary cache
        if: steps.crowsnest-bin-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/crowsnest-binaries
          key: ${{ steps.keys.outputs.CROWSNEST_BIN_KEY }}

      - name: Cleanup workspace
        run: |
          sudo rm -rf repository CustomPiOS extracted || true
          df -h

      - name: Zip Output
        run: |
          # build.img is already in workspace
          pigz -1 build.img

      - uses: actions/upload-artifact@v4
        with:
          name: build.img.gz
          path: build.img.gz