name: Build Image

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Update apt
        run: sudo apt-get update
      - name: Install Dependencies
        run: sudo apt-get install -y coreutils p7zip-full qemu-user-static python3-git rsync
      - name: Checkout CustomPiOS
        uses: actions/checkout@v4
        with:
          repository: "guysoft/CustomPiOS"
          path: CustomPiOS
      - name: Checkout Project Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          path: repository
          submodules: true
      - name: Download Raspbian Image
        run: cd repository/src/image && wget -q -c --trust-server-names 'https://downloads.raspberrypi.org/raspios_lite_armhf/images/raspios_lite_armhf-2025-05-13/2025-05-13-raspios-bookworm-armhf-lite.img.xz'
      - name: Update CustomPiOS Paths
        run: cd repository/src && ../../CustomPiOS/src/update-custompios-paths
      - name: Cache Klipper repo, venv, and firmware
        uses: actions/cache@v4
        with:
          path: |
            ~/klipper
          key: ${{ runner.os }}-klipper-${{ hashFiles('repository/src/modules/fullpageos/start_chroot_script') }}
          restore-keys: |
            ${{ runner.os }}-klipper-
            ${{ runner.os }}-
      - name: Cache Moonraker repo
        uses: actions/cache@v4
        with:
          path: |
            ~/moonraker
          key: ${{ runner.os }}-moonraker-${{ hashFiles('repository/src/modules/fullpageos/start_chroot_script') }}
          restore-keys: |
            ${{ runner.os }}-moonraker-
            ${{ runner.os }}-
      - name: Cache Crowsnest repo
        uses: actions/cache@v4
        with:
          path: |
            ~/crowsnest
          key: ${{ runner.os }}-crowsnest-${{ hashFiles('repository/src/modules/fullpageos/start_chroot_script') }}
          restore-keys: |
            ${{ runner.os }}-crowsnest-
            ${{ runner.os }}-
      - name: Restore Crowsnest binary cache
        uses: actions/cache@v4
        with:
          path: ~/crowsnest-binaries
          key: ${{ runner.os }}-crowsnest-binaries
          restore-keys: |
            ${{ runner.os }}-crowsnest-binaries-
      - name: Stage caches (incl. Crowsnest binaries) into host_cache
        run: |
          set -euxo pipefail
          DEST="repository/src/modules/fullpageos/filesystem/host_cache"
          rm -rf "$DEST"; mkdir -p "$DEST"
          
          for d in klipper moonraker crowsnest; do
            if [ -d "$HOME/$d" ]; then
              mkdir -p "$DEST/$d"
              rsync -a --delete "$HOME/$d/" "$DEST/$d/"
            fi
          done

          if [ -d "$HOME/crowsnest-binaries" ]; then
            mkdir -p "$DEST/crowsnest-binaries"
            rsync -a --delete "$HOME/crowsnest-binaries/" "$DEST/crowsnest-binaries/"
          fi

      - name: Build Image
        run: sudo modprobe loop && cd repository/src && sudo bash -x ./build_dist
      - name: Copy Output
        run: cp ${{ github.workspace }}/repository/src/workspace/*-raspios-*-lite.img build.img
      - name: Debug image file before mounting
        run: |
          IMAGE_FILE=$(ls repository/src/workspace/*.img | head -n1)
          echo "Image file: $IMAGE_FILE"
          echo "=== file output ==="
          file "$IMAGE_FILE"
          echo "=== fdisk output ==="
          sudo fdisk -l "$IMAGE_FILE" || true
          echo "=== losetup output ==="
          sudo losetup -f --show "$IMAGE_FILE" || true
          echo "=== parted output ==="
          sudo parted "$IMAGE_FILE" print || true

      - name: Extract build outputs from image for caching
        shell: bash
        run: |
          set -euxo pipefail

          # Clean up any previous mounts
          sudo umount -R extracted 2>/dev/null || true
          sudo losetup -D 2>/dev/null || true

          mkdir -p extracted

          IMAGE_FILE="$(ls repository/src/workspace/*.img | head -n1)"
          echo "Image file: $IMAGE_FILE"

          # Attach loop with partition scanning (-P creates /dev/loopXp1, /dev/loopXp2)
          LOOPDEV="$(sudo losetup -fP --show "$IMAGE_FILE")"
          echo "Loop device: $LOOPDEV"

          # Ensure we always clean up
          cleanup() {
            set +e
            sudo umount -R extracted 2>/dev/null || true
            sudo losetup -d "$LOOPDEV" 2>/dev/null || true
          }
          trap cleanup EXIT

          # Rootfs is p2 on Raspberry Pi OS images
          ROOT_PART="${LOOPDEV}p2"
          if [ ! -b "$ROOT_PART" ]; then
            echo "Did not find ${LOOPDEV}p2; available:"
            ls -l ${LOOPDEV}*
            exit 1
          fi

          echo "Mounting root partition: $ROOT_PART"
          sudo mount -o ro "$ROOT_PART" extracted

          echo "=== Listing /home/pi in mounted image ==="
          ls -lah extracted/home/pi || true

          echo "=== Klipper directory ==="
          ls -lah extracted/home/pi/klipper || true

          echo "=== Klipper out/ directory (firmware) ==="
          ls -lah extracted/home/pi/klipper/out || true

          echo "=== Moonraker directory ==="
          ls -lah extracted/home/pi/moonraker || true

          echo "=== Crowsnest directory ==="
          ls -lah extracted/home/pi/crowsnest || true

          echo "=== Crowsnest bin/ directory ==="
          ls -lah extracted/home/pi/crowsnest/bin || true

          echo "=== Crowsnest build/ directory ==="
          ls -lah extracted/home/pi/crowsnest/build || true

          echo "=== Copying build outputs to runner ==="
          sudo cp -r extracted/home/pi/klipper        "$HOME/klipper"        || true
          sudo cp -r extracted/home/pi/moonraker      "$HOME/moonraker"      || true
          sudo cp -r extracted/home/pi/crowsnest      "$HOME/crowsnest"      || true

          echo "=== Fixing permissions ==="
          sudo chown -R runner:docker "$HOME/klipper"        || true
          sudo chown -R runner:docker "$HOME/moonraker"      || true
          sudo chown -R runner:docker "$HOME/crowsnest"      || true

          # Extract Crowsnest binaries from image
          sudo mkdir -p "$HOME/crowsnest-binaries"
          sudo cp -f extracted/usr/local/bin/ustreamer       "$HOME/crowsnest-binaries/ustreamer"       2>/dev/null || true
          sudo cp -f extracted/usr/local/bin/camera-streamer "$HOME/crowsnest-binaries/camera-streamer" 2>/dev/null || true
          sudo cp -f extracted/usr/local/bin/crowsnest       "$HOME/crowsnest-binaries/crowsnest"       2>/dev/null || true
          sudo cp -f extracted/lib/systemd/system/crowsnest.service "$HOME/crowsnest-binaries/crowsnest.service" 2>/dev/null || true
          sudo cp -f extracted/etc/systemd/system/crowsnest.service "$HOME/crowsnest-binaries/crowsnest.service" 2>/dev/null || true
          sudo chown -R runner:docker "$HOME/crowsnest-binaries" || true

          echo "=== Verifying copied directories ==="
          ls -lah "$HOME/klipper" || true
          ls -lah "$HOME/crowsnest" || true
          du -sh "$HOME/klipper" "$HOME/moonraker" "$HOME/crowsnest" || true
      - name: Free space before caching
        run: |
          set -euxo pipefail
          # prune repos so caches are small
          for d in klipper moonraker crowsnest; do
            if [ -d "$HOME/$d/.git" ]; then
              git -C "$HOME/$d" gc --prune=now --aggressive || true
              git -C "$HOME/$d" repack -a -d --depth=1 --window=1 || true
            fi
          done

          # show sizes we’re about to cache
          du -sh "$HOME/klipper" "$HOME/moonraker" "$HOME/crowsnest" 2>/dev/null || true
          du -sh "$HOME/crowsnest-binaries" 2>/dev/null || true

          # delete big unneeded stuff BEFORE cache-save (keeps tar from OOM-ing)
          sudo rm -rf repository CustomPiOS extracted || true
          sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/*.deb || true
          sudo rm -rf /usr/share/dotnet /opt/ghc || true
          [ -n "${AGENT_TOOLSDIRECTORY:-}" ] && sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true
          df -h
      - name: Save Klipper cache
        uses: actions/cache/save@v4
        with:
          path: |
            ~/klipper
          key: ${{ runner.os }}-klipper-${{ hashFiles('repository/src/modules/fullpageos/start_chroot_script') }}

      - name: Save Moonraker cache
        uses: actions/cache/save@v4
        with:
          path: |
            ~/moonraker
          key: ${{ runner.os }}-moonraker-${{ hashFiles('repository/src/modules/fullpageos/start_chroot_script') }}

      - name: Save Crowsnest cache
        uses: actions/cache/save@v4
        with:
          path: |
            ~/crowsnest
          key: ${{ runner.os }}-crowsnest-${{ hashFiles('repository/src/modules/fullpageos/start_chroot_script') }}
      - name: Save Crowsnest binary cache
        uses: actions/cache/save@v4
        with:
          path: ~/crowsnest-binaries
          key: ${{ runner.os }}-crowsnest-binaries
      - name: Zip Output
        run: gzip build.img
      - uses: actions/upload-artifact@v4
        with:
          name: build.img.gz
          path: build.img.gz
