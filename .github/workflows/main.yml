name: Build Image

on: push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Free space early
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache || true
          sudo docker image prune -af || true
          df -h

      - name: Configure apt mirrors
        run: |
          set -euo pipefail
          mirror=""
          for candidate in https://archive.ubuntu.com/ubuntu https://mirrors.edge.kernel.org/ubuntu; do
            available=true
            for suite in noble noble-updates noble-backports noble-security; do
              if ! curl --fail --silent --show-error --location \
                --connect-timeout 10 --max-time 20 --output /dev/null \
                "${candidate}/dists/${suite}/InRelease"; then
                echo "::warning::Cannot reach ${candidate} (${suite}); trying the next mirror."
                available=false
                break
              fi
            done
            if [ "$available" = true ]; then
              mirror="$candidate"
              break
            fi
          done
          if [ -z "$mirror" ]; then
            echo "::error::No Ubuntu mirror is reachable. Check runner DNS/network connectivity and rerun the job."
            exit 1
          fi
          echo "Using Ubuntu mirror: $mirror"
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$source" ]; then
              sudo sed -i -E \
                "s#mirror\\+file:/etc/apt/apt-mirrors.txt|https?://(azure\\.archive|archive|security)\\.ubuntu\\.com/ubuntu#${mirror}#g" \
                "$source"
            fi
          done

      - name: Update apt
        run: sudo apt-get -o Acquire::Retries=5 -o APT::Update::Error-Mode=any update

      - name: Install Dependencies
        run: sudo apt-get -o Acquire::Retries=5 install -y coreutils p7zip-full qemu-user-static python3-git rsync pigz

      - name: Checkout CustomPiOS
        uses: actions/checkout@v4
        with:
          repository: "guysoft/CustomPiOS"
          path: CustomPiOS

      - name: Patch CustomPiOS (remove libconfig11 install)
        shell: bash
        run: |
          set -euxo pipefail
          echo "CustomPiOS HEAD: $(git -C CustomPiOS rev-parse --short HEAD)"

          mapfile -t FILES < <(grep -RIl --line-number 'libconfig11' CustomPiOS/src || true)

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No libconfig11 references found in CustomPiOS/src (nothing to patch)."
            exit 0
          fi

          echo "Patching files:"
          printf ' - %s\n' "${FILES[@]}"

          for f in "${FILES[@]}"; do
            echo "---- BEFORE ($f) ----"
            grep -n 'libconfig' "$f" || true

            sed -i '/apt-get .*install .*libconfig11/d' "$f"

            echo "---- AFTER ($f) ----"
            grep -n 'libconfig' "$f" || true
          done

          if grep -RIn 'apt-get .*install .*libconfig11' CustomPiOS/src; then
            echo "ERROR: libconfig11 install line still present after patch!"
            exit 1
          fi

      - name: Checkout Project Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          path: repository
          submodules: true

      - name: Download Raspbian Image
        run: |
          cd repository/src/image
          wget -q -c --trust-server-names \
            'https://downloads.raspberrypi.org/raspios_lite_armhf/images/raspios_lite_armhf-2025-05-13/2025-05-13-raspios-bookworm-armhf-lite.img.xz'

      - name: Update CustomPiOS Paths
        run: cd repository/src && ../../CustomPiOS/src/update-custompios-paths

      - name: Build Image
        run: |
          sudo modprobe loop
          cd repository/src
          sudo bash -x ./build_dist

      - name: Copy Output
        run: |
          cp ${{ github.workspace }}/repository/src/workspace/*-raspios-*-lite.img build.img

      - name: Debug image file before mounting
        run: |
          IMAGE_FILE=build.img
          echo "Image file: $IMAGE_FILE"
          echo "=== file output ==="
          file "$IMAGE_FILE"
          echo "=== fdisk output ==="
          sudo fdisk -l "$IMAGE_FILE" || true
          echo "=== parted output ==="
          sudo parted "$IMAGE_FILE" print || true

      - name: Cleanup workspace
        run: |
          sudo rm -rf repository CustomPiOS extracted || true
          df -h

      - name: Zip Output
        run: |
          pigz -1 build.img

      - name: Upload Image
        id: upload-image
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build.img.gz
          path: build.img.gz
          if-no-files-found: error
          compression-level: 0

      - name: Wait before retrying image upload
        if: ${{ steps.upload-image.outcome == 'failure' }}
        run: |
          echo "::warning::Image upload failed; retrying in 60 seconds."
          sleep 60

      - name: Retry Image Upload
        if: ${{ steps.upload-image.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: build.img.gz
          path: build.img.gz
          if-no-files-found: error
          compression-level: 0
          overwrite: true