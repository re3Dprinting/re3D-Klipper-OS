name: Build Image

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Update apt
        run: sudo apt-get update
      - name: Install Dependencies
        run: sudo apt install coreutils p7zip-full qemu-user-static python3-git
      - name: Checkout CustomPiOS
        uses: actions/checkout@v2
        with:
          repository: "guysoft/CustomPiOS"
          path: CustomPiOS
      - name: Checkout Project Repository
        uses: actions/checkout@v2
        with:
          repository: ${{ github.repository }}
          path: repository
          submodules: true
      - name: Download Raspbian Image
        run: cd repository/src/image && wget -q -c --trust-server-names 'https://downloads.raspberrypi.org/raspios_lite_armhf/images/raspios_lite_armhf-2025-05-13/2025-05-13-raspios-bookworm-armhf-lite.img.xz'
      - name: Update CustomPiOS Paths
        run: cd repository/src && ../../CustomPiOS/src/update-custompios-paths
      - name: Cache Klipper repo, venv, and firmware
        uses: actions/cache@v4
        with:
          path: |
            ~/klipper
            ~/klippy-env
            ~/klipper/out
          key: ${{ runner.os }}-klipper-${{ hashFiles('src/modules/fullpageos/start_chroot_script') }}
      - name: Cache Moonraker repo and venv
        uses: actions/cache@v4
        with:
          path: |
            ~/moonraker
            ~/moonraker-env
          key: ${{ runner.os }}-moonraker-${{ hashFiles('src/modules/fullpageos/start_chroot_script') }}
      - name: Cache Crowsnest repo and build output
        uses: actions/cache@v4
        with:
          path: |
            /home/pi/crowsnest
            /home/pi/crowsnest/build
          key: ${{ runner.os }}-crowsnest-${{ hashFiles('src/modules/fullpageos/start_chroot_script') }}
      - name: Log Klipper, Moonraker, Crowsnest paths
        run: |
          echo "KLIPPER DIR: $HOME/klipper"
          echo "KLIPPY VENV: $HOME/klippy-env"
          echo "KLIPPER OUT: $HOME/klipper/out"
          echo "MOONRAKER DIR: $HOME/moonraker"
          echo "MOONRAKER VENV: $HOME/moonraker-env"
          echo "CROWSNEST DIR: /home/pi/crowsnest"
          echo "CROWSNEST BUILD: /home/pi/crowsnest/build"
          ls -l $HOME/klipper || true
          ls -l $HOME/klippy-env || true
          ls -l $HOME/klipper/out || true
          ls -l $HOME/moonraker || true
          ls -l $HOME/moonraker-env || true
          ls -l /home/pi/crowsnest || true
          ls -l /home/pi/crowsnest/build || true
      - name: Build Image
        run: sudo modprobe loop && cd repository/src && sudo bash -x ./build_dist
      - name: Copy Output
        run: cp ${{ github.workspace }}/repository/src/workspace/*-raspios-*-lite.img build.img
      - name: Zip Output
        run: gzip build.img
      - uses: actions/upload-artifact@v4
        with:
          name: build.img.gz
          path: build.img.gz
      - name: Extract build outputs from image for caching
        run: |
          # Clean up any previous mounts
          sudo umount extracted 2>/dev/null || true
          sudo losetup -D 2>/dev/null || true

          # Prepare mount point
          mkdir -p extracted

          # Mount image
          echo "Mounting image..."
          sudo modprobe loop
          IMAGE_FILE=$(ls repository/src/workspace/*.img | head -n1)
          echo "Image file: $IMAGE_FILE"
          sudo mount -o loop,ro "$IMAGE_FILE" extracted

          # List contents for debugging
          echo "Listing /home/pi in mounted image:"
          ls -lh extracted/home/pi || true
          echo "Listing klipper, moonraker, crowsnest, venvs:"
          ls -lh extracted/home/pi/klipper || true
          ls -lh extracted/home/pi/klippy-env || true
          ls -lh extracted/home/pi/moonraker || true
          ls -lh extracted/home/pi/moonraker-env || true
          ls -lh extracted/home/pi/crowsnest || true
          ls -lh extracted/home/pi/klipper/out || true

          # Copy build outputs
          echo "Copying build outputs..."
          sudo cp -r extracted/home/pi/klipper $HOME/klipper || true
          sudo cp -r extracted/home/pi/klippy-env $HOME/klippy-env || true
          sudo cp -r extracted/home/pi/moonraker $HOME/moonraker || true
          sudo cp -r extracted/home/pi/moonraker-env $HOME/moonraker-env || true
          sudo cp -r extracted/home/pi/crowsnest $HOME/crowsnest || true
          sudo cp -r extracted/home/pi/klipper/out $HOME/klipper_out || true

          # Fix permissions
          echo "Fixing permissions..."
          sudo chown -R runner:docker $HOME/klipper || true
          sudo chown -R runner:docker $HOME/klippy-env || true
          sudo chown -R runner:docker $HOME/moonraker || true
          sudo chown -R runner:docker $HOME/moonraker-env || true
          sudo chown -R runner:docker $HOME/crowsnest || true
          sudo chown -R runner:docker $HOME/klipper_out || true

          # Unmount
          echo "Unmounting..."
          sudo umount extracted
          sudo losetup -D
      - name: Save Klipper cache
        uses: actions/cache/save@v4
        with:
          path: |
            $HOME/klipper
            $HOME/klippy-env
            $HOME/klipper_out
          key: ${{ runner.os }}-klipper-${{ hashFiles('src/modules/fullpageos/start_chroot_script') }}

      - name: Save Moonraker cache
        uses: actions/cache/save@v4
        with:
          path: |
            $HOME/moonraker
            $HOME/moonraker-env
          key: ${{ runner.os }}-moonraker-${{ hashFiles('src/modules/fullpageos/start_chroot_script') }}

      - name: Save Crowsnest cache
        uses: actions/cache/save@v4
        with:
          path: |
            $HOME/crowsnest
          key: ${{ runner.os }}-crowsnest-${{ hashFiles('src/modules/fullpageos/start_chroot_script') }}
